/* Gráfico de evolução do patrimônio */
function monthEnd(k){ const [y,m] = k.split('-').map(Number); return k + '-' + pad(new Date(y, m, 0).getDate()); }
/* Valor dos imóveis numa data passada: imóvel comprado depois não conta, e as parcelas pagas depois são descontadas */
function patrEm(fim, depois){
  return S.imoveis.reduce((a, im) => {
    if (im.dataCompra && im.dataCompra > fim) return a;
    const k = calcImovel(im), m = im.moeda || 'BRL';
    const pagoDepois = depois.filter(l => l.imovelId === im.id).reduce((x,l) => x + Math.abs(lancBRL(l)), 0);
    return a + Math.max(0, conv(k.liquido, m, 'BRL') - pagoDepois);
  }, 0);
}
function saldoBRL(x){ return Object.keys(x.valores || {}).reduce((a,c) => a + conv(+x.valores[c] || 0, c, 'BRL', x.taxas), 0); }
function evoSeries(T){
  const cur = monthKey(), snaps = S.snaps || {};
  const ks = Object.keys(snaps).concat(S.lancamentos.map(l => l.data.slice(0,7)), (S.saldos || []).map(x => x.data.slice(0,7))).filter(k => k <= cur).sort();
  let start = ks[0] || cur;
  if (monthsBetween(start, cur) > 23) start = addMonths(-23);
  const out = [];
  for (let k = start; k <= cur; k = (() => { const [y,m] = k.split('-').map(Number); return m === 12 ? (y+1) + '-01' : y + '-' + pad(m+1); })()){
    let liq, patr, est = false, real = false, realP = false;
    const fim = monthEnd(k), depois = S.lancamentos.filter(l => l.data > fim);
    const doMes = (S.saldos || []).filter(x => x.data.slice(0,7) === k).sort((a,b) => a.data < b.data ? -1 : 1);
    const regL = doMes.filter(x => Object.keys(x.valores || {}).length).pop(), regP = doMes.filter(x => +x.patrimonio > 0).pop();
    const reg = regL || regP;
    if (k === cur){ liq = T.liquidoBRL; patr = T.patrBRL; }
    else if (snaps[k]){ liq = snaps[k].l; patr = snaps[k].p; }
    else {
      if (regP){ patr = +regP.patrimonio; realP = true; }
      else patr = patrEm(fim, depois);
      if (regL){ liq = saldoBRL(regL); real = true; }
      else liq = T.liquidoBRL - depois.reduce((a,l) => a + lancBRL(l), 0);
      est = true;
    }
    out.push({ k, liq, patr, tot: liq + patr, est, real, realP, reg: reg ? reg.data : '' });
  }
  return out;
}
const EVO = [
  { id:'tot',  n:'Patrimônio total', c:'#B38600' },
  { id:'patr', n:'Imóveis',          c:'#9F7AEA' },
  { id:'liq',  n:'Liquidez',         c:'#1A9C6E' }
];
let EVO_DATA = [];
function evoCard(T){
  const data = evoSeries(T), vc = S.settings.view;
  EVO_DATA = data;
  if (data.length < 2) return `<h3 class="sec">Evolução do patrimônio</h3>
    <div class="card pad"><div class="empty">O gráfico ganha forma a cada mês. Informe saldos de meses anteriores para ver a evolução desde o começo.<br><button class="btn sm bg-yellow" style="margin-top:12px" onclick="openSaldos()">${ic('plus')}Saldos anteriores</button></div></div>`;
  const W = 760, H = 260, L = 64, R = 92, Tp = 16, B = 34;
  const vals = data.flatMap(d => EVO.map(e => fromBRL(d[e.id], vc)));
  let mx = Math.max(...vals, 0), mn = Math.min(...vals, 0);
  const span = (mx - mn) || 1, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
  const step = [1,2,2.5,5,10].map(f => f*mag).find(x => x >= stepRaw);
  mn = Math.floor(mn / step) * step; mx = Math.ceil(mx / step) * step;
  const x = i => L + i * (W - L - R) / (data.length - 1);
  const y = v => Tp + (mx - v) / ((mx - mn) || 1) * (H - Tp - B);
  let grid = '';
  for (let v = mn; v <= mx + step/2; v += step)
    grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="evo-grid"/><text x="${L-8}" y="${y(v)+4}" class="evo-ax" text-anchor="end">${esc(compact(v, vc))}</text>`;
  const every = Math.ceil(data.length / 8);
  const xl = data.map((d,i) => (i % every === 0 || i === data.length-1) ? `<text x="${x(i)}" y="${H-10}" class="evo-ax" text-anchor="middle">${MON[+d.k.slice(5)-1]}/${d.k.slice(2,4)}</text>` : '').join('');
  const path = id => data.map((d,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(fromBRL(d[id], vc)).toFixed(1)).join(' ');
  const area = `${path('tot')} L ${x(data.length-1)} ${y(Math.max(mn,0))} L ${x(0)} ${y(Math.max(mn,0))} Z`;
  const last = data[data.length-1];
  let labs = EVO.map(e => ({ e, yy: y(fromBRL(last[e.id], vc)) })).sort((a,b) => a.yy - b.yy);
  for (let i = 1; i < labs.length; i++) if (labs[i].yy - labs[i-1].yy < 15) labs[i].yy = labs[i-1].yy + 15;
  const ends = labs.map(o => `<text x="${W-R+10}" y="${o.yy+4}" class="evo-end">${esc(compact(fromBRL(last[o.e.id], vc), vc))}</text>`).join('');
  const lines = EVO.map(e => `<path d="${path(e.id)}" fill="none" stroke="${e.c}" stroke-width="${e.id==='tot'?3:2}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const dots = EVO.map(e => data.map((d,i) => `<circle cx="${x(i)}" cy="${y(fromBRL(d[e.id], vc))}" r="4" fill="${d.est && !((d.real && e.id === 'liq') || (d.realP && e.id === 'patr') || (d.real && d.realP)) ? '#171717' : e.c}" stroke="${e.c}" stroke-width="2"/>`).join('')).join('');
  const hits = data.map((d,i) => `<rect x="${x(i) - (W-L-R)/(data.length-1)/2}" y="${Tp}" width="${(W-L-R)/(data.length-1)}" height="${H-Tp-B}" fill="transparent" onmouseenter="evoTip(${i})" ontouchstart="evoTip(${i})"/>`).join('');
  const hasEst = data.some(d => d.est), semData = S.imoveis.filter(i => !i.dataCompra);
  const first = data[0], g = last.tot - first.tot;
  return `<h3 class="sec">Evolução do patrimônio</h3>
  <div class="card evo">
    <div class="evo-head">
      <div><small>Desde ${MONTHS[+first.k.slice(5)-1]} de ${first.k.slice(0,4)}</small><b class="num ${g<0?'neg':''}">${g>=0?'+':''}${compact(fromBRL(g, vc), vc)}</b></div>
      <div class="row wrapr" style="gap:12px"><div class="legend" style="margin:0">${EVO.map(e => `<span><i style="background:${e.c}"></i>${e.n}</span>`).join('')}</div>
        <button class="btn sm bg-yellow" onclick="openSaldos()">${ic('edit')}Editar histórico</button></div>
    </div>
    <div class="evo-wrap" onmouseleave="evoTip(-1)">
      <svg viewBox="0 0 ${W} ${H}" class="evo-svg" role="img" aria-label="Evolução mensal do patrimônio">
        ${grid}${xl}
        <path d="${area}" fill="#FDE047" opacity=".07"/>
        <line id="evoX" x1="0" x2="0" y1="${Tp}" y2="${H-B}" class="evo-x" style="display:none"/>
        ${lines}${dots}${ends}${hits}
      </svg>
      <div class="evo-tip" id="evoTip" style="display:none"></div>
    </div>
    ${hasEst ? '<div class="hint" style="padding:0 18px 4px">Pontos cheios são valores informados por você em Editar histórico. Pontos vazados são estimados pelos lançamentos e pela data de compra de cada imóvel.</div>' : ''}
    ${semData.length ? `<div class="evo-warn"><b>${semData.length} ${semData.length > 1 ? 'imóveis estão' : 'imóvel está'} sem data de compra</b> e por isso ${semData.length > 1 ? 'contam' : 'conta'} em todos os meses do gráfico: ${semData.map(i => `<a onclick="editImovel('${i.id}')">${esc(i.nome)}</a>`).join(', ')}.</div>` : '<div style="height:10px"></div>'}
  </div>`;
}
function evoTip(i){
  const tip = $('#evoTip'), ln = $('#evoX'); if (!tip) return;
  if (i < 0){ tip.style.display = 'none'; ln.style.display = 'none'; return; }
  const d = EVO_DATA[i], vc = S.settings.view, n = EVO_DATA.length;
  const W = 760, L = 64, R = 92, xx = L + i * (W - L - R) / (n - 1);
  ln.setAttribute('x1', xx); ln.setAttribute('x2', xx); ln.style.display = '';
  tip.innerHTML = `<b>${MONTHS[+d.k.slice(5)-1]} ${d.k.slice(0,4)}${(d.real || d.realP) ? ' · registro de ' + fmtDate(d.reg) : d.est ? ' · estimado' : ''}</b>` +
    EVO.map(e => `<div class="kv"><span><i style="background:${e.c}"></i>${e.n}</span><b class="num">${money(fromBRL(d[e.id], vc), vc)}</b></div>`).join('');
  tip.style.display = 'block';
  const pct = xx / W * 100;
  tip.style.left = pct > 55 ? '' : 'calc(' + pct + '% + 12px)';
  tip.style.right = pct > 55 ? 'calc(' + (100 - pct) + '% + 12px)' : '';
}

function saveSaldo(id){
  const data = $('#sd_data').value; if (!data){ toast('Informe a data'); return; }
  const valores = {}; activeCur().forEach(c => { const v = parseNum($('#sd_' + c).value); if (v) valores[c] = v; });
  const patrimonio = parseNum($('#sd_patr').value);
  if (!Object.keys(valores).length && !patrimonio){ toast('Informe um saldo ou o valor dos imóveis'); return; }
  const tx = parseNum($('#sd_tx').value), obj = { data, valores, patrimonio, taxas: tx ? { USD: tx } : {} };
  S.saldos = S.saldos || [];
  if (id) Object.assign(S.saldos.find(x => x.id === id), obj); else { obj.id = uid('sd'); S.saldos.push(obj); }
  persist(); renderAll(); openSaldos(); toast('Registro salvo');
}
function delSaldo(id){
  if (!confirm('Excluir este saldo?')) return;
  S.saldos = S.saldos.filter(x => x.id !== id); persist(); renderAll(); openSaldos();

        <div class="hint" id="phHint">${local ? 'A foto é recortada em círculo e salva junto com os dados' : GAS ? 'A foto fica salva no seu Google Drive' : 'Modo de teste, a foto fica só neste navegador'}</div>
      </div>

function setPhoto(url){
  $('#f_foto').value = url;
  const p = $('#phPrev'); p.style.backgroundImage = url ? `url('${url}')` : ''; p.innerHTML = url ? '' : ic('camera','lg');
}
let PHOTO_UPLOADING = false;
/* Redimensiona a imagem no navegador. quadrado = recorta no centro (fotos de perfil) */
function shrinkImg(img, max, q, quadrado){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  if (quadrado){
    const lado = Math.min(img.width, img.height), sx = (img.width - lado) / 2, sy = (img.height - lado) / 2, out = Math.min(max, lado);
    c.width = c.height = out; g.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
  } else {
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); g.drawImage(img, 0, 0, c.width, c.height);
  }
  return c.toDataURL('image/jpeg', q);
}
function pickPhoto(inp, local){
  const f = inp.files && inp.files[0]; if (!f) return;
  const hint = $('#phHint');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onerror = () => { hint.textContent = 'Não consegui ler essa imagem. Tente uma foto JPG ou PNG.'; };
    img.onload = () => {
      if (local || !GAS){ setPhoto(shrinkImg(img, local ? 480 : 900, .82, !!local)); hint.textContent = 'Foto pronta, clique em Salvar'; return; }
      const data = shrinkImg(img, 1200, .82);
      setPhoto(data); PHOTO_UPLOADING = true; hint.textContent = 'Enviando foto…';
      google.script.run
        .withSuccessHandler(url => { PHOTO_UPLOADING = false; setPhoto(url); hint.textContent = 'Foto salva no Drive'; })
        .withFailureHandler(err => {
          PHOTO_UPLOADING = false;
          setPhoto(shrinkImg(img, 800, .72));
          hint.textContent = 'O Drive não aceitou a foto' + (err && err.message ? ' (' + err.message + ')' : '') + ', então ela ficou salva junto com os dados. Pode salvar normalmente.';
        })
        .uploadFoto(data, f.name, TOKEN);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function photoPending(){ if (PHOTO_UPLOADING){ toast('Aguarde a foto terminar de enviar'); return true; } return false; }

    return `<div class="ach-grp"><div class="ach-gh"><b>${t}</b><span class="chip ${n === list.length ? 'bg-teal' : ''}">${n} de ${list.length}</span></div>

  <h3 class="sec">Linha do tempo</h3>

      </div></div>`;
  }).join('')}</div>`
  : '<div class="empty">A história de vocês começa aqui. Adicione o primeiro momento, como o casamento, a compra da casa ou o primeiro aporte.</div>'}`;
}
function editMomento(id){

function saveMomento(id){
  const titulo = $('#h_titulo').value.trim(); if (!titulo){ toast('Dê um título ao momento'); return; }

  S.historia = S.historia || [];
  const obj = { titulo, data: $('#h_data').value || todayISO(), texto: $('#h_texto').value.trim(), foto: $('#f_foto').value, cor: $('#f_cor').value };

  closeModal(); commit(); toast('Momento guardado ❤️');
}
function delMomento(id){
  if (!confirm('Excluir este momento?')) return;
  S.historia = S.historia.filter(h => h.id !== id); closeModal(); commit();

/* Resumo do mês para compartilhar */
let RESUMO_TXT = '';
function openResumo(){
  const T = totals(), vc = S.settings.view, k = monthKey(), C = S.settings.conquistas || {};

  const ach = ACH.filter(a => C[a.id] && C[a.id].startsWith(k));
  const cv = b => compact(fromBRL(b, vc), vc), cvR = b => compact(fromBRL(b, vc), vc, true);
  RESUMO_TXT = ['✨ Resumo de ' + monthName(k), '',
    'Patrimônio total ' + cvR(T.totalBRL),
    g > 0 ? 'Crescemos ' + cvR(g) + ' este mês' : null,
    pay > 0 ? 'Investimos ' + cvR(pay) + ' em imóveis' : null,
    'Já são ' + pctFmt(p,0) + ' do primeiro milhão',
    f.key ? 'No ritmo atual, chegamos lá em ' + f.label : null,
    ach.length ? '\u{1F3C6} ' + ach.map(a => a.t).join(', ') : null,
    '', 'Gestão de Capital · Andrey Marques'].filter(x => x !== null).join('\n');
  const tile = (l, v, c) => `<div class="r-tile"><small>${l}</small><b class="num ${c||''}">${v}</b></div>`;
  openModal(`
    <div class="mhead bg-yellow"><div><small style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px">Resumo do mês</small><h3 style="text-transform:capitalize">${monthName(k)}</h3></div>
      <button class="btn icon bg-paper" onclick="closeModal()">${ic('close')}</button></div>
    <div class="mbody">
      <div class="resumo">
        <span class="kicker">${IC.spark} ${monthName(k)}</span>
        <div class="r-big num">${cv(T.totalBRL)}</div>
        <div class="r-sub">patrimônio total de vocês</div>
        <div class="pbar" style="height:16px;margin-top:14px"><i class="bg-coral" style="width:${Math.min(100, Math.max(0,p))}%"></i></div>
        <div class="r-sub mono" style="margin-top:6px">${pctFmt(p,0)} do primeiro milhão</div>
        <div class="r-grid">
          ${tile('Cresceram', (g > 0 ? '+' : '') + cv(g), g < 0 ? 'neg' : '')}
          ${tile('Em imóveis', cv(pay))}
          ${tile('Milhão previsto', f.key ? f.label : f.done ? 'Batido!' : 'Em breve')}
        </div>
        ${ach.length ? `<div class="r-ach">\u{1F3C6} ${ach.map(a => a.t).join(', ')}</div>` : ''}
        <div class="r-love">Gestão de Capital · Andrey Marques</div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="copyResumo()">Copiar texto</button>
      <a class="btn bg-teal" href="https://wa.me/?text=${encodeURIComponent(RESUMO_TXT)}" target="_blank" rel="noopener">${ic('share')}Enviar no WhatsApp</a>
    </div>`);
}
function copyResumo(){
  const fb = () => { const a = document.createElement('textarea'); a.value = RESUMO_TXT; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); toast('Texto copiado'); } catch(e){ toast('Não consegui copiar'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(RESUMO_TXT).then(() => toast('Texto copiado')).catch(fb); else fb();
}
