function initFooter(){
  const v = document.getElementById('footVid'), f = document.getElementById('foot');
  if (!v || !f || v.dataset.ok) return; v.dataset.ok = 1;
  const c = document.createElement('canvas'); c.width = c.height = 1;
  const x = c.getContext('2d', { willReadFrequently:true });
  let last = '';
  const pinta = () => {
    try {
      if (v.readyState >= 2){
        x.drawImage(v, 3, 272, 1, 1, 0, 0, 1, 1);
        const d = x.getImageData(0, 0, 1, 1).data, col = 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
        if (col !== last){ last = col; f.style.backgroundColor = col; f.classList.toggle('ink', .299*d[0] + .587*d[1] + .114*d[2] > 160); }
      }
    } catch(e){}
  };
  const loop = () => { pinta(); if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(loop); else if (!v.paused) requestAnimationFrame(loop); };
  v.addEventListener('playing', () => { if (!v.requestVideoFrameCallback) requestAnimationFrame(loop); });
  v.addEventListener('loadeddata', pinta);
  const fonte = v.canPlayType('video/mp4; codecs="avc1.64001F"') ? FOOT_VID : v.canPlayType('video/webm; codecs="vp9"') ? FOOT_WEBM : FOOT_VID;
  fetch(fonte).then(r => r.blob()).then(b => {
    v.src = URL.createObjectURL(b);
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(loop);
    const tocar = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
    if ('IntersectionObserver' in window){
      new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? tocar() : v.pause())).observe(f);
    } else tocar();
  }).catch(() => {});
}

let PHOTO_UPLOADING = false;
/* Redimensiona a imagem no navegador. quadrado = recorta no centro (fotos de perfil) */
function shrinkImg(img, max, q, quadrado){
  const c = document.createElement('canvas'), g = c.getContext('2d');
  if (quadrado){
    const lado = Math.min(img.width, img.height), sx = (img.width - lado) / 2, sy = (img.height - lado) / 2, out = Math.min(max, lado);
    c.width = c.height = out; g.drawImage(img, sx, sy, lado, lado, 0, 0, out, out);
  } else {
    const sc = Math.min(1, max / Math.max(img.width, img.height));
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); g.drawImage(img, 0, 0, c.width, c.height);
  }
  return c.toDataURL('image/jpeg', q);
}
function pickPhoto(inp, local){
  const f = inp.files && inp.files[0]; if (!f) return;
  const hint = $('#phHint');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onerror = () => { hint.textContent = 'Não consegui ler essa imagem. Tente uma foto JPG ou PNG.'; };
    img.onload = () => {
      if (local || !GAS){ setPhoto(shrinkImg(img, local ? 480 : 900, .82, !!local)); hint.textContent = 'Foto pronta, clique em Salvar'; return; }
      const data = shrinkImg(img, 1200, .82);
      setPhoto(data); PHOTO_UPLOADING = true; hint.textContent = 'Enviando foto…';
      google.script.run
        .withSuccessHandler(url => { PHOTO_UPLOADING = false; setPhoto(url); hint.textContent = 'Foto salva no Drive'; })
        .withFailureHandler(err => {
          PHOTO_UPLOADING = false;
          setPhoto(shrinkImg(img, 800, .72));
          hint.textContent = 'O Drive não aceitou a foto' + (err && err.message ? ' (' + err.message + ')' : '') + ', então ela ficou salva junto com os dados. Pode salvar normalmente.';
        })
        .uploadFoto(data, f.name, TOKEN);
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function photoPending(){ if (PHOTO_UPLOADING){ toast('Aguarde a foto terminar de enviar'); return true; } return false; }

/* Nossa História */
function vHis(T){
  const C = S.settings.conquistas || {}, got = ACH.filter(a => C[a.id]).length;
  const ev = [];
  (S.historia || []).forEach(h => ev.push(Object.assign({ kind:'m' }, h)));
  S.imoveis.forEach(im => { if (im.dataCompra) ev.push({ kind:'im', id:im.id, data:im.dataCompra, titulo:'Conquistamos ' + im.nome, texto:im.endereco || '', foto:im.foto, cor:im.cor }); });
  ACH.forEach(a => { if (C[a.id] && !achHide(a)) ev.push({ kind:'a', data:C[a.id], titulo:a.t, texto:a.d, cor:a.c }); });
  ev.sort((a,b) => a.data < b.data ? 1 : -1);
  const icon = { m:'heart', im:'home', a:'trophy' }, tag = { m:'Momento', im:'Imóvel', a:'Conquista' };
  return `
  <div class="card his-head">
    <span class="his-heart bg-coral">${ic('heart','lg')}</span>
    <div style="flex:1;min-width:220px"><h2>Nossa História</h2><p>Cada parcela, cada aporte e cada conquista, construídos juntos.</p>
      <div class="row wrapr" style="margin-top:10px;gap:8px"><span class="chip bg-yellow">${ic('trophy')} ${PRIV() ? '•••' : got + ' de ' + ACH.length} conquistas</span><span class="chip">${ev.length} momentos</span></div></div>
    <div class="row wrapr" style="gap:8px"><button class="btn bg-yellow" onclick="editMomento()">${ic('plus')}Novo momento</button><button class="btn" onclick="openResumo()">${ic('share')}Resumo do mês</button></div>
  </div>

  <h3 class="sec">Conquistas</h3>
  ${ACH_GRUPOS.map(([t, ids]) => { const list = ids.map(id => ACH.find(a => a.id === id)).filter(Boolean), n = list.filter(a => C[a.id]).length;
    return `<div class="ach-grp"><div class="ach-gh"><b>${t}</b><span class="chip ${n === list.length && !PRIV() ? 'bg-teal' : ''}">${PRIV() && list.some(achHide) ? '•••' : n + ' de ' + list.length}</span></div>
      <div class="grid g-ach">${list.map(achCard).join('')}</div></div>`; }).join('')}

  <h3 class="sec">Linha do tempo</h3>
  ${ev.length ? `<div class="tl">${ev.map(e => {
    const click = e.kind === 'm' ? `onclick="editMomento('${e.id}')"` : e.kind === 'im' ? `onclick="openImovel('${e.id}')"` : '';
    return `<div class="tl-item">
      <span class="tl-dot bg-${e.cor || 'coral'}">${ic(icon[e.kind])}</span>
      <div class="card tl-card ${click ? 'click' : ''}" ${click}>
        ${e.foto ? `<div class="tl-img" style="background-image:url('${esc(e.foto)}')"></div>` : ''}
        <div class="tl-body"><small>${fmtDate(e.data)} · ${tag[e.kind]}</small><b>${esc(e.titulo)}</b>${e.texto ? `<p>${esc(e.texto)}</p>` : ''}</div>
      </div></div>`;
  }).join('')}</div>`
  : '<div class="empty">A história de vocês começa aqui. Adicione o primeiro momento, como o casamento, a compra da casa ou o primeiro aporte.</div>'}`;
}
function editMomento(id){
  const ex = id ? (S.historia||[]).find(h => h.id === id) : null;
  const h = ex || { data: todayISO(), titulo:'', texto:'', foto:'', cor:'coral' };
  openModal(`
    <div class="mhead bg-pink"><h3>${ex ? 'Editar momento' : 'Novo momento'}</h3><button class="btn icon bg-paper" onclick="closeModal()">${ic('close')}</button></div>
    <div class="mbody">
      <div class="g2">
        <div class="field"><label>Título</label><input id="h_titulo" value="${esc(h.titulo)}" placeholder="Ex. Compramos nossa casa"></div>
        <div class="field"><label>Data</label><input id="h_data" type="date" value="${h.data}"></div>
      </div>
      <div class="field"><label>Lembrança</label><textarea id="h_texto" rows="3" placeholder="O que esse momento significou para vocês">${esc(h.texto)}</textarea></div>
      ${photoField(h.foto)}
      <div class="field"><label>Cor</label><div class="row wrapr">${COLORS.map(c => `<button type="button" class="btn icon bg-${c} colorpick" data-c="${c}" style="width:36px;height:36px;${c===h.cor?'outline:3px solid var(--ink);outline-offset:2px':''}" onclick="pickColor(this)"></button>`).join('')}</div><input type="hidden" id="f_cor" value="${h.cor}"></div>
    </div>
    <div class="mfoot">
      ${ex ? `<button class="btn bg-pink" onclick="delMomento('${ex.id}')">${ic('trash')}Excluir</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn bg-teal" onclick="saveMomento('${ex ? ex.id : ''}')">${ic('heart')}Salvar momento</button>
    </div>`);
}
function saveMomento(id){
  const titulo = $('#h_titulo').value.trim(); if (!titulo){ toast('Dê um título ao momento'); return; }
  if (photoPending()) return;
  S.historia = S.historia || [];
  const obj = { titulo, data: $('#h_data').value || todayISO(), texto: $('#h_texto').value.trim(), foto: $('#f_foto').value, cor: $('#f_cor').value };
  if (id) Object.assign(S.historia.find(h => h.id === id), obj); else { obj.id = uid('h'); S.historia.push(obj); }
  closeModal(); commit(); toast('Momento guardado ❤️');
}
function delMomento(id){
  if (!confirm('Excluir este momento?')) return;
  S.historia = S.historia.filter(h => h.id !== id); closeModal(); commit();
}

/* Resumo do mês para compartilhar */
let RESUMO_TXT = '';
function openResumo(){
  const T = totals(), vc = S.settings.view, k = monthKey(), C = S.settings.conquistas || {};
  const g = growthMonth(T), f = forecast(T), p = T.totalBRL / goalTotalBRL() * 100;
  const pay = S.lancamentos.filter(l => l.imovelId && l.data.startsWith(k)).reduce((a,l) => a + Math.abs(lancBRL(l)), 0);
  const ach = ACH.filter(a => C[a.id] && C[a.id].startsWith(k));
  const cv = b => compact(fromBRL(b, vc), vc), cvR = b => compact(fromBRL(b, vc), vc, true);
  RESUMO_TXT = ['✨ Resumo de ' + monthName(k), '',
    'Patrimônio total ' + cvR(T.totalBRL),
    g > 0 ? 'Crescemos ' + cvR(g) + ' este mês' : null,
    pay > 0 ? 'Investimos ' + cvR(pay) + ' em imóveis' : null,
    'Já são ' + pctFmt(p,0,true) + ' do primeiro milhão',
    f.key ? 'No ritmo atual, chegamos lá em ' + f.label : null,
    ach.length ? '\u{1F3C6} ' + ach.map(a => a.t).join(', ') : null,
    '', 'Gestão de Capital · Andrey Marques'].filter(x => x !== null).join('\n');
  const tile = (l, v, c) => `<div class="r-tile"><small>${l}</small><b class="num ${c||''}">${v}</b></div>`;
  openModal(`
    <div class="mhead bg-yellow"><div><small style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px">Resumo do mês</small><h3 style="text-transform:capitalize">${monthName(k)}</h3></div>
      <button class="btn icon bg-paper" onclick="closeModal()">${ic('close')}</button></div>
    <div class="mbody">
      <div class="resumo">
        <span class="kicker">${IC.spark} ${monthName(k)}</span>
        <div class="r-big num">${cv(T.totalBRL)}</div>
        <div class="r-sub">patrimônio total de vocês</div>
        <div class="pbar" style="height:16px;margin-top:14px"><i class="bg-coral" style="width:${Math.min(100, Math.max(0,p))}%"></i></div>
        <div class="r-sub mono" style="margin-top:6px">${pctFmt(p,0)} do primeiro milhão</div>
        <div class="r-grid">
          ${tile('Cresceram', (g > 0 ? '+' : '') + cv(g), g < 0 ? 'neg' : '')}
          ${tile('Em imóveis', cv(pay))}
          ${tile('Milhão previsto', PRIV() ? '•••' : f.key ? f.label : f.done ? 'Batido!' : 'Em breve')}
        </div>
        ${ach.length && !PRIV() ? `<div class="r-ach">\u{1F3C6} ${ach.map(a => a.t).join(', ')}</div>` : ''}
        <div class="r-love">Gestão de Capital · Andrey Marques</div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="copyResumo()">Copiar texto</button>
      <a class="btn bg-teal" href="https://wa.me/?text=${encodeURIComponent(RESUMO_TXT)}" target="_blank" rel="noopener">${ic('share')}Enviar no WhatsApp</a>
    </div>`);
}
function copyResumo(){
  const fb = () => { const a = document.createElement('textarea'); a.value = RESUMO_TXT; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); toast('Texto copiado'); } catch(e){ toast('Não consegui copiar'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(RESUMO_TXT).then(() => toast('Texto copiado')).catch(fb); else fb();
}
