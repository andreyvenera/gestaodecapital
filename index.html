  --coral:#FF7A66;--purple:#A78BFA;--teal:#34D399;--yellow:#FEC504;--blue:#60A5FA;--orange:#FB923C;--pink:#F472B6;--cream:#A3A3A3;
  --pos:#4ADE80;--neg:#F87171;
  --ease:cubic-bezier(.22,1,.36,1);
  --b:1px solid var(--glass-b);--sh:0 30px 60px -20px rgba(0,0,0,.6);--sh-s:0 12px 30px -12px rgba(0,0,0,.5);--r:32px;
  --fh:'Inter',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);overflow-x:clip}
body{font-family:var(--fb);color:var(--white);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-weight:800;letter-spacing:-.02em}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.grid{display:grid;gap:16px}
.hidden{display:none!important}
.ic{display:inline-flex}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.lg svg{width:26px;height:26px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px;position:relative}

/* ---------- cores de identidade ---------- */
.bg-coral{--acc:var(--coral)}.bg-purple{--acc:var(--purple)}.bg-teal{--acc:var(--teal)}.bg-yellow{--acc:var(--shout)}
.bg-blue{--acc:var(--blue)}.bg-orange{--acc:var(--orange)}.bg-pink{--acc:var(--pink)}.bg-cream{--acc:var(--cream)}.bg-paper{--acc:#fff}.bg-ink{--acc:#000}
[class*="bg-"]{background:color-mix(in srgb,var(--acc) 16%,var(--surface))}
.bg-yellow{background:var(--shout)!important;color:#000}
.bg-ink{background:#000!important;color:#fff}
.bg-paper{background:var(--deep)}
.pbar i[class*="bg-"],.legend i[class*="bg-"],.compo i[class*="bg-"],.dots i[class*="bg-"],.mb i[class*="bg-"],.fill[class*="bg-"],
.strip[class*="bg-"],.colorpick[class*="bg-"],.ibx[class*="bg-"],.ach-ic[class*="bg-"],.tl-dot[class*="bg-"],.r-tile i[class*="bg-"]{background:var(--acc)!important;color:#000}

/* ---------- formulários ---------- */
input,select,textarea{font:500 14px var(--fb);color:#fff;background:var(--deep);border:1px solid transparent;border-radius:999px;padding:12px 18px;width:100%;outline:none;transition:border-color .2s,background .2s}
textarea{border-radius:20px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{border-color:var(--shout);background:#2e2e2e}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
input[type=date]{color-scheme:dark}
input[type=range]{accent-color:var(--shout);background:transparent;padding:0}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 4px}
.field{margin-bottom:16px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

/* ---------- botões em pílula ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--fb);background:var(--deep);color:#fff;border:1px solid transparent;border-radius:999px;padding:11px 20px;white-space:nowrap;text-decoration:none;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .2s}
.btn:hover{transform:scale(1.05);box-shadow:0 14px 30px -10px rgba(0,0,0,.6)}
.btn:active{transform:scale(.95)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.icon{padding:10px;aspect-ratio:1}
.btn.bg-yellow,.btn.bg-teal{background:var(--shout)!important;color:#000}
.btn.bg-pink{background:transparent!important;color:var(--neg);border-color:rgba(248,113,113,.35)}
.btn.bg-paper,.btn.bg-purple,.btn.bg-orange,.btn.bg-coral,.btn.bg-blue{background:#fff!important;color:#000}
.btn[disabled]{opacity:.6;pointer-events:none}
.linkbtn{border:0;background:none;font:600 13px var(--fb);display:inline-flex;align-items:center;gap:4px;opacity:.75}
.linkbtn:hover{opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;background:var(--deep);color:#fff;white-space:nowrap}
.chip.bg-teal{background:rgba(74,222,128,.15)!important;color:var(--pos)}
.chip.bg-orange{background:rgba(251,146,60,.15)!important;color:var(--orange)}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--deep);color:var(--muted)}
.info{width:22px;height:22px;border-radius:50%;border:1px solid var(--glass-b);background:transparent;color:var(--muted);font:700 11px var(--fb)}
.info:hover{color:#000;background:var(--shout);border-color:var(--shout)}

/* ---------- superfícies ---------- */
.card{background:var(--surface);border-radius:var(--r);position:relative;border:1px solid var(--line)}
.pad{padding:24px}
.click{cursor:pointer;transition:transform .5s var(--ease),border-color .3s}
.click:hover{transform:translateY(-4px);border-color:var(--glass-b)}
.click-bar{cursor:pointer}
h3.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:28px;font-weight:800;letter-spacing:-.04em;margin:56px 0 18px}
h3.sec::after{content:none}
.empty{padding:36px 24px;text-align:center;color:var(--muted);border:1px dashed var(--glass-b);border-radius:24px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;max-width:min(560px,calc(100vw - 32px));background:#fff;color:#000;border-radius:24px;padding:14px 22px;line-height:1.45;font-weight:600;z-index:90;box-shadow:var(--sh);animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:95;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(var(--rot,0deg))}}
@keyframes slideup{from{opacity:0;transform:translateY(28px)}}
main#view>*{animation:slideup .8s var(--ease) both}
main#view{min-height:calc(100vh - 80px);min-height:calc(100svh - 80px)}

/* ---------- área amarela (líquida) ---------- */
.liquid{background:var(--shout);color:#000;border-radius:0 0 120px 40px;padding-bottom:70px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 0}
.nv{display:block;background:currentColor;-webkit-mask:var(--nvm) left center/contain no-repeat;mask:var(--nvm) left center/contain no-repeat;flex-shrink:0}

.brand .nv-full{height:40px;color:#000}
.brand .nv-mark{height:38px;color:#000;display:none}
.brand-sep{width:1.5px;height:34px;background:rgba(0,0,0,.25);border-radius:2px}
@media (max-width:640px){.brand .nv-full{height:34px}}
.ct-logo{height:64px;color:var(--shout);margin:0 auto 6px;background-position:center;-webkit-mask-position:center;mask-position:center}
.brand-btn{background:none;border:0;padding:4px;margin:-4px;border-radius:12px;cursor:pointer;display:flex;transition:transform .3s var(--ease),opacity .2s}
.brand-btn:hover{opacity:.78}
.brand-btn:active{transform:scale(.95)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;background:#000;display:grid;place-items:center;flex-shrink:0}
.logo svg{width:20px;height:20px;fill:var(--shout)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1}
.brand p{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-top:4px}
.outline{-webkit-text-stroke:0;color:inherit;opacity:.45}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ratePill{background:transparent;color:#000;font-weight:700;font-size:12px;padding:6px 4px}
#ratePill .ic svg{width:15px;height:15px}
.seg{display:inline-flex;background:rgba(0,0,0,.08);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#000;transition:background .2s}
.seg button.on{background:#000;color:var(--shout)}
.top .btn{background:#000!important;color:#fff;border:0}
.top .btn.bg-yellow{background:#000!important;color:var(--shout)}
#btnPriv{width:40px;height:40px;padding:0}
.save{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;opacity:.6}
.save i{width:8px;height:8px;border-radius:50%;background:#000}
.save.busy i{animation:pulse .8s infinite}
.save.err i{background:#dc2626}
@keyframes pulse{50%{opacity:.2}}

.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding:44px 0 10px;min-height:520px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.07);border-radius:999px;padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#000}
.hero-title{font-size:14px;font-weight:600;opacity:.6;margin:26px 0 4px}
.hero-big{font-size:clamp(44px,8vw,128px);font-weight:900;letter-spacing:-.065em;line-height:.9;cursor:pointer;white-space:nowrap}
.story{font-size:clamp(16px,1.6vw,20px);font-weight:500;line-height:1.5;opacity:.82;max-width:520px;margin-top:26px}
.story b{font-weight:800}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.modes .btn{background:transparent;color:#000;border:2px solid rgba(0,0,0,.18);padding:11px 22px}
.modes .btn.on{background:#000!important;color:#fff;border-color:#000}
.modes .btn.icon{padding:10px}
.tier{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-top:22px}

.hero-r{position:relative;height:100%;min-height:440px;display:flex;align-items:center;justify-content:center}
.phone{--rot:-4deg;position:relative;margin:30px 0 60px;width:min(100%,360px);aspect-ratio:3/4.1;background:#000;color:#fff;border-radius:40px;padding:26px;display:flex;flex-direction:column;box-shadow:0 50px 90px -30px rgba(0,0,0,.55);transform:rotate(-4deg);animation:float 7s ease-in-out infinite}
.ph-top{display:flex;justify-content:flex-start;gap:10px;align-items:center}
.ph-ic{width:44px;height:44px;border-radius:50%;background:var(--deep);display:grid;place-items:center}
.ph-ic svg{width:20px;height:20px;fill:var(--shout)}
.hero-pct{background:var(--shout);color:#000;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:800;cursor:pointer}
.ph-body{margin-top:0}
.ph-lbl{font-size:12px;opacity:.6;font-weight:500}
.ph-val{font-size:clamp(30px,3.4vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 18px}
.bar{position:relative;height:6px;background:var(--deep);border-radius:999px;cursor:pointer}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--shout)!important;border-radius:999px;transition:width 1.6s var(--ease)}
.bar .runner{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(254,197,4,.35);transition:left 1.6s var(--ease)}
.bar .runner svg{display:none}
.marks{position:relative;height:22px;margin-top:10px;font-size:11px;opacity:.55}
.mk{position:absolute;transform:translateX(-50%);top:0;font-weight:600}
.mk i{display:none}
.mk.hit{opacity:1;color:var(--shout)}
.mk-end{left:auto!important;right:0;transform:none}
.ph-actions{display:flex;gap:10px;margin-top:18px}
.ph-actions .btn{flex:1}
.ph-actions .btn.white{background:#fff!important;color:#000}
.ph-actions .btn.dark{background:var(--deep)!important;color:#fff;border:1px solid rgba(255,255,255,.12)}

.minis{position:absolute;inset:0;pointer-events:none}
.mini{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:24px;cursor:pointer;
  background:rgba(255,255,255,.35);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.6);box-shadow:0 20px 40px -18px rgba(0,0,0,.35);color:#000;animation:float 6s ease-in-out infinite}
.mini:nth-child(1){top:0;right:-6%;--rot:0deg}
.mini:nth-child(2){bottom:0;left:-8%;background:#000;color:#fff;border-color:#000;animation-delay:-3s}
.mini .mi{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex-shrink:0}
.mini:nth-child(2) .mi{background:var(--shout);color:#000}
.mini .mi svg{width:17px;height:17px}
.mini small{display:block;font-size:11px;font-weight:600;opacity:.65}
.mini b{font-size:17px;font-weight:800;letter-spacing:-.02em}

.ph-people{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 0}
.avs{display:flex;align-items:center;justify-content:center}
.av{width:118px;height:118px;border-radius:50%;border:5px solid #000;margin-left:-26px;background:var(--shout) center/cover no-repeat;color:#000;font-size:42px;font-weight:900;display:grid;place-items:center;transition:transform .4s var(--ease);position:relative}
.av:first-child{margin-left:0}
.av:hover{transform:translateY(-4px) scale(1.06);z-index:2}
.av.add{background:var(--deep);color:#fff;width:52px;height:52px;margin-left:-14px;align-self:flex-end;font-size:20px}
.avs.n1 .av:first-child,.avs.n0 .av:first-child{width:160px;height:160px;font-size:56px}
.avs.n3 .av:not(.add),.avs.n4 .av:not(.add){width:92px;height:92px;font-size:34px;margin-left:-20px}
.avs .av:first-child{margin-left:0}
.av.add svg{width:22px;height:22px}
.ph-names{font-size:16px;font-weight:700;letter-spacing:-.01em;opacity:.85;text-align:center}
.photo-prev.round{border-radius:50%}
/* ---------- vazio escuro ---------- */
.void{position:relative;padding-top:40px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;width:max-content;max-width:100%;margin:0 auto 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font:600 13px var(--fb);padding:10px 16px;border-radius:999px;white-space:nowrap;transition:color .2s,background .3s var(--ease)}
.tab .ic svg{width:16px;height:16px}
.tab:hover{color:#fff}
.tab.on{background:var(--shout);color:#000}
body.simple .tabs{display:none}

/* números do dashboard */
.g-dash{grid-template-columns:repeat(4,1fr)}
.stat{padding:22px;min-height:150px;display:flex;flex-direction:column;overflow:hidden}
.stat .strip{position:absolute;left:22px;top:0;width:28px;height:4px;border-radius:0 0 4px 4px}
.stat .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.stat .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .ibx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.stat .ibx svg{width:16px;height:16px}
.stat .v{font-size:clamp(26px,2.6vw,34px);font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:26px}
.stat .s{font-size:13px;color:var(--muted);margin-top:6px}
.g-dash .stat:first-child{background:var(--shout);color:#000;border-color:var(--shout)}
.g-dash .stat:first-child .lbl,.g-dash .stat:first-child .s{color:rgba(0,0,0,.6)}
.g-dash .stat:first-child .ibx{background:#000!important;color:var(--shout)}
.g-dash .stat:first-child .info{border-color:rgba(0,0,0,.25);color:#000}
.span2{grid-column:span 2}
.more{margin-top:18px}
.more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);padding:6px 0}
.more summary::-webkit-details-marker{display:none}
.more summary .ic{transition:transform .3s var(--ease)}
.more[open] summary .ic{transform:rotate(90deg)}
.g-more{grid-template-columns:repeat(3,1fr);margin-top:12px}

/* contas e listas */
.g-ct{grid-template-columns:repeat(3,1fr)}
.acct{overflow:hidden}
.acct .strip{position:absolute;left:24px;top:0;width:28px;height:4px;border-radius:0 0 4px 4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dt{min-width:54px;height:54px;border-radius:18px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.1}
.li .dt b{font-size:18px;color:#fff;letter-spacing:-.02em}
.li .main{flex:1;min-width:0}
.li .main .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main .m{font-size:12px;color:var(--muted);margin-top:2px}
.li .val{font-weight:700;white-space:nowrap}
.click-li{cursor:pointer;border-radius:18px;padding-left:8px;padding-right:8px;margin:0 -8px}
.click-li:hover{background:var(--deep)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.compo{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px}
.compo i{height:100%;border-radius:999px}
.rec-sum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rec-sum .kv{padding:6px 0}
.rec-tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:var(--shout);color:#000;border-radius:999px;padding:12px 20px;font-weight:700}
.rec-tot b{font-size:18px;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-weight:600}

/* gráfico de evolução */
.evo{overflow:hidden}
.evo-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:24px 24px 8px}
.evo-head small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.evo-head b{font-size:32px;font-weight:800;letter-spacing:-.045em}
.evo-wrap{position:relative;padding:0 10px 6px}
.evo-svg{width:100%;height:auto;display:block}
body.priv .pbar i,body.priv .bar .fill{width:0!important}
body.priv .compo i{flex:1 1 0;width:auto!important;background:var(--deep)!important}
body.priv .evo-svg{filter:blur(12px);pointer-events:none}
body.priv .evo-svg .evo-ax{display:none}
body.priv .evo-tip{display:none!important}
body.priv .bar .runner{left:2%!important}
.evo-grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.evo-ax{font:500 11px var(--fb);fill:rgba(255,255,255,.45)}
.evo-end{font:700 12px var(--fb);fill:#fff}
.evo-x{stroke:rgba(255,255,255,.4);stroke-width:1;stroke-dasharray:3 4}
.evo-tip{position:absolute;top:12px;min-width:220px;background:rgba(23,23,23,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-b);border-radius:20px;padding:12px 14px;font-size:12px;pointer-events:none;z-index:5;box-shadow:var(--sh)}
.evo-tip b{display:block;margin-bottom:6px;text-transform:capitalize}
.evo-tip .kv{padding:3px 0}
.evo-tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.evo-warn{margin:6px 24px 20px;padding:12px 16px;border-radius:20px;background:rgba(251,146,60,.12);color:#fed7aa;font-size:12px;line-height:1.55}
.evo-warn a{font-weight:700;text-decoration:underline;cursor:pointer}

/* previsão */
.forecast{display:flex;align-items:center;gap:18px;padding:22px 24px;margin-top:16px;flex-wrap:wrap;background:#000;border-color:var(--line)}
.fc-ic{width:56px;height:56px;border-radius:50%;background:var(--shout)!important;color:#000;display:grid;place-items:center;flex-shrink:0}
.fc-t{flex:1;min-width:200px}
.fc-t small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fc-t b{display:block;font-size:30px;font-weight:800;letter-spacing:-.045em;text-transform:capitalize;line-height:1.1;margin:4px 0}
.fc-t span{font-size:13px;color:var(--muted)}

/* calendário */
.cal-wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-head h2{font-size:28px;font-weight:800;letter-spacing:-.045em;text-transform:capitalize}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.wk span{text-align:center;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;min-height:48px;border:0;border-radius:18px;background:var(--deep);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:8px;position:relative;transition:transform .3s var(--ease),background .2s}
.day:hover{transform:scale(1.06)}
.day.blank{background:transparent;pointer-events:none}
.day .dn{font-weight:700;font-size:13px}
.day .dv{font-size:10px;font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--shout)}
.day.sel{background:var(--shout);color:#000}
.day.sel .dv{color:#000}
.day .dots{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.msum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.msum div{background:var(--deep);border-radius:20px;padding:12px 14px}
.msum div.bg-yellow{background:var(--shout)!important;color:#000}
.msum small{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.msum b{font-size:15px}
.dot-l::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot-l.teal::before{background:var(--teal)}.dot-l.coral::before{background:var(--coral)}.dot-l.purple::before{background:var(--purple)}

/* imóveis */
.g-im{grid-template-columns:repeat(3,1fr)}
.im{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .5s var(--ease),border-color .3s}
.im:hover{transform:translateY(-6px);border-color:var(--glass-b)}
.im-photo{height:170px;background:center/cover no-repeat}
.im .top-s{padding:18px 22px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:transparent!important}
.im .top-s small{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.im .top-s small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc,var(--shout))}
.im .top-s h4{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.im .top-s .chip{background:var(--deep)}
.im .body{padding:12px 22px 22px;display:flex;flex-direction:column;gap:9px;flex:1}
.im .bv{font-size:32px;font-weight:800;letter-spacing:-.045em}
.pbar{height:6px;border-radius:999px;background:var(--deep);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px}
.add-card{border:1px dashed var(--glass-b);border-radius:var(--r);display:grid;place-items:center;min-height:260px;cursor:pointer;color:var(--muted);font-weight:600;text-align:center;transition:color .2s,border-color .2s}
.add-card:hover{color:var(--shout);border-color:var(--shout)}
.add-card>div{display:flex;flex-direction:column;align-items:center;gap:8px}

/* modal em vidro */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:50;overflow-y:auto}
.modal.hidden{display:none}
.mbox{width:100%;max-width:580px;background:rgba(23,23,23,.92);border:1px solid var(--glass-b);border-radius:32px;box-shadow:var(--sh);animation:slideup .6s var(--ease);overflow:hidden}
.mbox.wide{max-width:860px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 26px 6px;background:transparent!important;color:#fff}
.mhead small{color:var(--muted)}
.mhead h3{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1;display:flex;align-items:center;gap:10px}
.mhead .btn.icon{background:var(--deep)!important;color:#fff}
.mbody{padding:18px 26px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:16px 26px 24px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--deep);border-radius:22px;padding:14px 16px}
.tile.bg-yellow{color:#000}
.tile small{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.tile b{font-size:18px;font-weight:800;letter-spacing:-.03em}
.tile em{display:block;font-style:normal;font-size:11px;opacity:.6;margin-top:3px}
.addr{display:flex;align-items:center;gap:14px;background:var(--deep);border-radius:24px;padding:14px 14px 14px 20px;margin-bottom:16px}
.addr .t{flex:1;font-weight:500;line-height:1.4;display:flex;gap:8px;align-items:center}
.mapbtn{width:48px;height:48px;border-radius:50%;background:var(--shout);color:#000;display:grid;place-items:center;flex-shrink:0;transition:transform .3s var(--ease)}
.mapbtn:hover{transform:scale(1.1)}
.im-banner{height:220px;border-radius:24px;background:center/cover no-repeat;margin-bottom:16px}
.ret{background:var(--shout);color:#000;border-radius:28px;padding:20px;margin:16px 0}
.ret .tile{background:rgba(0,0,0,.08)}
.ret .chip{background:#000;color:var(--shout)}
.ret .hint,.ret .muted{color:rgba(0,0,0,.6)}
.ret .pos,.bd-total .pos,.proj-total .pos,.resumo .pos{color:#0a6b3a}.ret .neg,.bd-total .neg{color:#b42318}
.ret input{background:#fff;color:#000}
.ret input[type=range]{accent-color:#000;background:transparent}
.seg-sm{background:rgba(0,0,0,.1)!important}
.seg-sm button{color:#000;padding:6px 12px;font-size:12px}
.seg-sm button.on{background:#000;color:var(--shout)}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-prev{width:96px;height:96px;border-radius:24px;background:var(--deep) center/cover no-repeat;display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.colorpick{border-radius:50%!important;width:34px!important;height:34px!important;padding:0!important}

/* composição */
.bd-group{background:var(--deep);border-radius:24px;overflow:hidden;margin-bottom:12px}
.bd-h{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent!important}
.bd-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:0}
.bd-l small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.bd-v{font-weight:700;white-space:nowrap}
.bd-sub{background:rgba(255,255,255,.04)}
.bd-total{background:var(--shout);color:#000;border-radius:24px;padding:6px 0 14px}
.bd-total .bd-row{border-bottom:1px solid rgba(0,0,0,.1)}
.bd-total .bd-row:first-child .bd-v{font-size:24px;letter-spacing:-.03em}
.bd-total .pbar{margin:12px 18px 0;background:rgba(0,0,0,.12)}
.bd-total .pbar i{background:#000!important}
.bd-total>div:last-child{margin:6px 18px 0}

/* a receber e projeção */
.g-rec{grid-template-columns:1fr 1fr;margin-bottom:16px}
.proj{padding:24px;margin-bottom:16px}
.proj-h{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.proj-h .ibx{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--deep)!important}
.proj-h small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.proj-h .muted{font-size:13px}
.proj-rows .kv{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.proj-total{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;background:var(--shout);color:#000;border-radius:28px;padding:16px 24px}
.proj-total span{font-weight:700}
.proj-total b{display:block;font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.05}
.proj-total small{font-size:12px;opacity:.6;font-weight:600}

/* wallet */
.g-wal{grid-template-columns:1.3fr 1fr}
.fx{padding:28px;background:var(--shout)!important;color:#000;border-color:var(--shout);border-radius:40px 40px 100px 40px}
.fx .kicker{background:#000;color:var(--shout)}
.fx .chip{background:rgba(0,0,0,.08);color:#000}
.fx .btn{background:#000!important;color:#fff}
.fx .big{font-size:clamp(48px,7vw,84px);font-weight:900;letter-spacing:-.06em;line-height:.9}
.fx label{color:rgba(0,0,0,.6)}
.fx input{background:rgba(255,255,255,.65);color:#000}
.fx input::placeholder{color:rgba(0,0,0,.4)}
.spark{width:100%;height:90px;margin-top:18px;border-radius:20px;background:rgba(0,0,0,.06)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:18px}
.conv .eq{font-weight:800;font-size:20px;padding-bottom:12px}
.cv-sel{width:auto;display:inline-block;padding:2px 26px 2px 10px;font-size:10px;font-weight:700;background-color:rgba(0,0,0,.1);color:#000;background-image:none}
.kicker{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--deep)}
.kicker svg{width:12px;height:12px;fill:currentColor}
.g-fx{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fxc{padding:18px 20px}
.g-wal>.grid .stat{min-height:130px}

/* ajustes */
.cur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cur-opt{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;border-radius:999px;background:var(--deep);cursor:pointer;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
.cur-opt input{width:auto;accent-color:var(--shout);margin:0;padding:0}
.cur-opt b{color:#fff;min-width:30px}
.cur-opt.on{background:var(--shout);color:rgba(0,0,0,.7)}
.cur-opt.on b{color:#000}
.cur-opt.on input{accent-color:#000}

/* conquistas e história */
.his-head{display:flex;align-items:center;gap:22px;padding:30px;flex-wrap:wrap;background:var(--shout)!important;color:#000;border-color:var(--shout);border-radius:40px 100px 40px 40px}
.his-head h2{font-size:clamp(34px,5vw,56px);font-weight:900;letter-spacing:-.06em;line-height:.95}
.his-head p{opacity:.65;margin-top:8px}
.his-head .chip{background:rgba(0,0,0,.08)!important;color:#000}
.his-head .btn{background:#000!important;color:#fff}
.his-heart{width:72px;height:72px;border-radius:50%;background:#000!important;color:var(--shout);display:grid;place-items:center;flex-shrink:0}
.ach-grp{margin-bottom:26px}
.ach-gh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ach-gh b{font-size:16px;font-weight:700;letter-spacing:-.02em}

function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+' '+MON[+m-1]+' '+y; }
function curSym(c){ return (CUR[c] || { s:c }).s; }
function curDec(c){ const d = (CUR[c] || {}).d; return d === undefined ? 2 : d; }
function activeCur(){ const a = (S && S.settings.moedas) || ['BRL','USD']; return CUR_KEYS.filter(k => k === 'BRL' || a.includes(k)); }
function otherCur(c){ return c === 'BRL' ? (activeCur().find(k => k !== 'BRL') || 'USD') : 'BRL'; }
function curOptions(sel){
  const list = activeCur(); if (sel && !list.includes(sel)) list.push(sel);
  return list.map(k => `<option value="${k}" ${k===sel?'selected':''}>${k} · ${CUR[k] ? CUR[k].n : k}</option>`).join('');
}
function money(v, cur, force){
  cur = cur || 'BRL';
  if (!force && S && S.settings.privado) return curSym(cur) + ' •••';
  const d = curDec(cur), n = Math.abs(+v||0).toLocaleString('pt-BR',{ minimumFractionDigits:d, maximumFractionDigits:d });
  return (+v < 0 ? '−' : '') + curSym(cur) + ' ' + n;
}
function compact(v, cur, force){
  cur = cur || 'BRL';
  const sym = curSym(cur) + ' ';
  if (!force && S && S.settings.privado) return sym + '•••';
  const a = Math.abs(+v||0);
  if (curDec(cur) > 2) return (v<0?'−':'') + sym + a.toLocaleString('pt-BR',{ maximumFractionDigits:4 });
  let t;
  if (a >= 1e6) t = (a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2}) + ' mi';
  else if (a >= 1e3) t = (a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil';
  else t = a.toLocaleString('pt-BR',{maximumFractionDigits:0});
  return (v<0?'−':'') + sym + t;
}
const PRIV = () => !!(S && S.settings && S.settings.privado);
function pctFmt(p, d=1, pub){ if (!pub && PRIV()) return '••%'; return (+p||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}) + '%'; }
function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s||'').trim().replace('−','-').replace(/[^\d,.\-]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const fmtIn = n => (n || n === 0) && +n !== 0 ? (+n).toLocaleString('pt-BR',{maximumFractionDigits:2}) : '';
/* RATES guarda quantos reais vale 1 unidade de cada moeda */
function rateOf(c, ov){ if (c === 'BRL') return 1; if (ov && ov[c]) return ov[c]; return RATES[c] || 0; }
function conv(v, from, to, ov){
  from = from || 'BRL'; to = to || 'BRL';
  if (from === to) return v;
  if (typeof ov === 'number') ov = { USD: ov };
  const a = rateOf(from, ov), b = rateOf(to, ov);
  return a && b ? v * a / b : 0;
}
function lancTaxas(l){ return Object.assign({}, l.cotacao ? { USD:l.cotacao } : {}, l.taxas || {}); }
function cdiAA(){ return (S && S.settings.cdiManual) ? +S.settings.cdiManual : (MARKET.cdi && MARKET.cdi.aa) ? MARKET.cdi.aa : 14.9; }

}

function lancAbsEm(l, cur){ return conv(Math.abs(+l.valor||0), contaMoeda(l), cur, lancTaxas(l)); }
function lancBRL(l){ return conv(+l.valor||0, contaMoeda(l), 'BRL', lancTaxas(l)); }

function calcImovel(im){
  const pays = S.lancamentos.filter(l => l.imovelId === im.id).sort((a,b) => a.data < b.data ? -1 : 1);
  const pagoSis = pays.reduce((a,l) => a + lancAbsEm(l, im.moeda), 0);
  const investido = (+im.entrada||0) + (+im.pagoAntes||0) + pagoSis;
  const parcelasPagas = (+im.parcelasPagasBase||0) + pays.length;
  let saldoDev, liquido;
  if (im.metodo === 'mercado'){
    saldoDev = Math.max(0, (+im.saldoDevedorBase||0) - pagoSis);
    liquido = (+im.valorTotal||0) - saldoDev;
  } else {
    saldoDev = (+im.valorTotal||0) ? Math.max(0, (+im.valorTotal) - investido) : 0;
    liquido = investido;
  }
  let lucro, venda, retPct;
  if (im.vendaModo === 'valor' && +im.vendaValor > 0){
    venda = (+im.vendaValor) - saldoDev;
    lucro = venda - liquido;
    retPct = liquido > 0 ? lucro / liquido * 100 : 0;
  } else {
    retPct = +im.retorno || 0;
    lucro = liquido * retPct / 100;
    venda = liquido + lucro;
  }
  const total = +im.parcelasTotal || 0;
  return { pays, pagoSis, investido, parcelasPagas, saldoDev, liquido, lucro, venda, retPct,
           restantes: total ? Math.max(0, total - parcelasPagas) : null,
           pctParcelas: total ? Math.min(100, parcelasPagas/total*100) : null };
}
function calcRec(r){
  const pays = S.lancamentos.filter(l => l.receberId === r.id);
  const rec = pays.reduce((a,l) => a + lancAbsEm(l, r.moeda||'BRL'), 0);
  const pend = Math.max(0, (+r.valor||0) - rec);
  return { pays, rec, pend, pct: +r.valor ? Math.min(100, rec/(+r.valor)*100) : 0, done: pend <= 0.005 };
}
function totals(){
  let usd = 0, brl = 0, liquidoBRL = 0;
  S.contas.forEach(c => { const v = contaSaldo(c); if (c.moeda === 'USD') usd += v; if (c.moeda === 'BRL') brl += v; liquidoBRL += conv(v, c.moeda, 'BRL'); });
  let patrBRL = 0, investBRL = 0, lucroBRL = 0;
  S.imoveis.forEach(im => {
    const k = calcImovel(im), m = im.moeda || 'BRL';
    patrBRL += conv(k.liquido, m, 'BRL'); investBRL += conv(k.investido, m, 'BRL'); lucroBRL += conv(k.lucro, m, 'BRL');
  });
  let receberBRL = 0; S.receber.forEach(r => receberBRL += conv(calcRec(r).pend, r.moeda||'BRL', 'BRL'));
  const totalBRL = liquidoBRL + patrBRL;
  const mensalTx = Math.pow(1 + cdiAA()/100, 1/12) - 1;
  let rendBRL = 0, baseCDI = 0;
  S.contas.forEach(c => {
    if (c.moeda === 'BRL' && +c.cdi > 0){ const s = Math.max(0, contaSaldo(c)); baseCDI += s; rendBRL += s * mensalTx * (+c.cdi/100); }
  });
  return { usd, brl, liquidoBRL, patrBRL, investBRL, lucroBRL, receberBRL, totalBRL, rendBRL, baseCDI,
           futuroBRL: totalBRL + receberBRL + lucroBRL };
}
function fromBRL(v, cur){ return conv(v, 'BRL', cur || 'BRL'); }
function dual(vBRL){
  const vw = S.settings.view, ot = otherCur(vw);
  return { main: compact(fromBRL(vBRL, vw), vw), sub: money(fromBRL(vBRL, ot), ot) };
}

let saveTimer = null;
function setSave(state, txt){ const el = $('#saveState'); el.className = 'save ' + state; el.innerHTML = '<i></i>' + txt; }
function persist(){
  setSave('busy','Salvando');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const json = JSON.stringify(S);
    if (!GAS){ try { localStorage.setItem('gcp_data', json); } catch(e){} }
    if (GAS){
      google.script.run

        .saveData(json, TOKEN);
    } else setSave('', 'Salvo neste navegador');
  }, 700);
}
function commit(){ persist(); renderAll(); }
function hydrate(raw){
  let d = null;
  try { d = raw ? JSON.parse(raw) : null; } catch(e){ d = null; }
  if (!d) d = clone(DEFAULT);
  const base = clone(DEFAULT);
  const out = Object.assign(base, d);
  out.settings = Object.assign(clone(DEFAULT.settings), d.settings || {});
  out.settings.goals = Object.assign(clone(DEFAULT.settings.goals), (d.settings||{}).goals || {});
  out.settings.marcos = out.settings.marcos || {};
  if (!Array.isArray(out.settings.moedas)) out.settings.moedas = ['BRL','USD'];
  if (!out.snaps || typeof out.snaps !== 'object' || Array.isArray(out.snaps)) out.snaps = {};
  ['contas','imoveis','receber','lancamentos','historia','saldos'].forEach(k => { if (!Array.isArray(out[k])) out[k] = clone(DEFAULT[k]); });
  if (!out.settings.seedSaldos && SEED_SALDOS.length){
    SEED_SALDOS.forEach((x,i) => { if (!out.saldos.some(y => y.data === x.data)) out.saldos.push(Object.assign({ id:'sd_seed' + i }, clone(x))); });
    out.settings.seedSaldos = 1;
    setTimeout(() => persist(), 1500);
  }
  return out;
}

function showConta(aba){
  S = null; document.body.classList.add('locked');
  CT_ABA = aba === 'criar' ? 'criar' : 'entrar';
  let el = document.getElementById('lock');
  if (!el){ el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); }
  const novo = CT_ABA === 'criar';
  const n = CUR_KEYS.length, fill = t => t.replace('{n}', n);
  el.innerHTML = `<div class="lang">
    <button class="lang-btn" onclick="toggleLangMenu(event)">${LOGIN_LANG}<span class="flag">${FLAG[LOGIN_LANG]}</span><span class="caret">▴</span></button>
    <div class="lang-menu" id="langMenu">${LOGIN_LANGS.map(l => `<button class="${l === LOGIN_LANG ? 'on' : ''}" onclick="setLoginLang('${l}')"><span>${l}</span><span class="flag">${FLAG[l]}</span></button>`).join('')}</div>
  </div>
  <div class="ct-wrap">
  <div class="lock-box card ct-box">
    <span class="nv nv-full ct-logo" role="img" aria-label="Nectar Ventures"></span>
    <div class="ct-kicker">${LT('kicker')}</div>
    <div class="seg lock-seg"><button class="${novo?'':'on'}" onclick="showConta('entrar')">${LT('tabIn')}</button><button class="${novo?'on':''}" onclick="showConta('criar')">${LT('tabUp')}</button></div>
    <p class="ct-lead">${novo ? LT('leadUp') : LT('leadIn')}</p>
    <label class="ct-field"><span>${LT('user')}</span>
      <input id="ctUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="${esc(LT('userPh'))}" value="${esc(USUARIO)}"></label>
    <label class="ct-field"><span>${LT('pin')}</span>
      <input id="ctPin" class="ct-pin" type="password" inputmode="numeric" autocomplete="${novo?'new-password':'current-password'}" maxlength="8" placeholder="${esc(LT('pinPh'))}" onkeydown="if(event.key==='Enter'&&!${novo})contaEnviar()"></label>
    ${novo ? `<label class="ct-field"><span>${LT('pin2')}</span>
      <input id="ctPin2" class="ct-pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" placeholder="${esc(LT('pin2Ph'))}" onkeydown="if(event.key==='Enter')contaEnviar()"></label>` : ''}
    <button class="btn bg-teal lock-btn" id="pinBtn" onclick="contaEnviar()" data-novo="${novo?1:0}">${novo ? LT('btnUp') : LT('btnIn')}</button>
    <div class="lock-msg" id="pinMsg"></div>
    ${novo ? `<div class="ct-hint">${LT('hint')}</div>` : ''}
  </div>
  <div class="ct-side">
    ${loginShowcase()}
    <div class="ct-about">
      <b>${LT('aboutT')}</b>
      <p>${fill(LT('aboutP'))}</p>
      <div class="ct-chips">${LT('chips').map(c => `<span>${fill(c)}</span>`).join('')}</div>
    </div>
  </div>
  </div>`;
  setTimeout(() => { const i = $(USUARIO && !novo ? '#ctPin' : '#ctUser'); if (i) i.focus(); }, 50);
}
function contaEnviar(){
  const btn = $('#pinBtn'), msg = $('#pinMsg'), novo = btn.dataset.novo === '1';
  const u = ($('#ctUser').value || '').trim().toLowerCase(), pin = ($('#ctPin').value || '').trim();
  if (!/^[a-z0-9._-]{3,20}$/.test(u)){ msg.textContent = LT('errUser'); return; }
  if (!/^\d{4,8}$/.test(pin)){ msg.textContent = LT('errPin'); return; }
  if (novo && pin !== ($('#ctPin2').value || '').trim()){ msg.textContent = LT('errMatch'); return; }
  const txt = btn.textContent; btn.disabled = true; btn.textContent = novo ? LT('busyUp') : LT('busyIn'); msg.textContent = '';
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.textContent = txt;
      if (r && r.ok){
        TOKEN = r.token; USUARIO = u;
        try { localStorage.setItem('gc_token', TOKEN); localStorage.setItem('gc_user', u); } catch(e){}
        if (novo) toast(LT('welcome'));
        loadAll(); return;
      }
      $('#ctPin').value = '';
      const e = r && r.erro;
      msg.textContent = r && r.bloqueado ? LT('blocked') : e ? (SRV_ERR[e] ? LT(SRV_ERR[e]) : /^Usuário inválido/.test(e) ? LT('errUser') : e) : LT('wrong');
    })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = txt; const m = e && e.message || ''; msg.textContent = (!m || /fetch|network|load failed/i.test(m)) ? LT('errConn') : LT('errServer') + m; })
    [novo ? 'criarConta' : 'entrarConta'](u, pin);
}
function hideLock(){ document.body.classList.remove('locked'); const el = document.getElementById('lock'); if (el) el.remove(); }
function entrar(){
  const pin = ($('#pinIn').value || '').trim(), msg = $('#pinMsg'), btn = $('#pinBtn');
  if (!pin){ msg.textContent = 'Digite o PIN'; return; }
  btn.disabled = true; btn.textContent = 'Conferindo…'; msg.textContent = '';
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.textContent = 'Entrar';
      if (r && r.ok){ TOKEN = r.token; try { localStorage.setItem('gc_token', TOKEN); } catch(e){} loadAll(); return; }
      $('#pinIn').value = '';
      msg.textContent = r && r.bloqueado ? 'Muitas tentativas. Aguarde 10 minutos e tente de novo.'
        : r && r.semPin ? (showLock({ message:'AUTH_SETUP' }), '')
        : 'PIN incorreto' + (r && r.restantes >= 0 ? ', restam ' + r.restantes + ' tentativas' : '');
    })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'Entrar'; msg.textContent = 'Não consegui conferir agora, tente de novo'; })
    .verificarPin(pin);
}
function criarPinApp(){
  const a = ($('#pinNew').value || '').trim(), b = ($('#pinNew2').value || '').trim(), msg = $('#pinMsg'), btn = $('#pinBtn');
  if (!/^\d{4,8}$/.test(a)){ msg.textContent = 'Use de 4 a 8 números'; return; }
  if (a !== b){ msg.textContent = 'Os dois PINs não são iguais'; return; }
  btn.disabled = true; btn.textContent = 'Criando…';
  google.script.run
    .withSuccessHandler(r => {
      btn.disabled = false; btn.textContent = 'Criar PIN e entrar';
      if (r && r.ok){ TOKEN = r.token; try { localStorage.setItem('gc_token', TOKEN); } catch(e){} toast('PIN criado'); loadAll(); return; }
      if (r && r.erro === 'O PIN já foi criado'){ showLock({ message:'AUTH' }); return; }
      msg.textContent = (r && r.erro) || 'Não consegui criar o PIN';
    })
    .withFailureHandler(() => { btn.disabled = false; btn.textContent = 'Criar PIN e entrar'; msg.textContent = 'Não consegui criar agora, tente de novo'; })
    .criarPin(a);
}
function sair(){
  if (!confirm('Sair da sua conta neste aparelho?')) return;
  const fim = () => { try { localStorage.removeItem('gc_token'); localStorage.removeItem('gcp_data'); } catch(e){} TOKEN = ''; location.reload(); };
  const pend = $('#saveState') && $('#saveState').classList.contains('busy');
  if (GAS && S && pend){
    clearTimeout(saveTimer); setSave('busy','Salvando');
    google.script.run.withSuccessHandler(fim).withFailureHandler(() => { if (confirm('Não consegui salvar a última alteração. Sair mesmo assim?')) fim(); }).saveData(JSON.stringify(S), TOKEN);
  } else fim();
}
function sairAparelho(){
  if (!confirm('Sair deste aparelho? Será preciso digitar o PIN de novo.')) return;

function salvarPin(){
  const a = $('#tp_a').value.trim(), n = $('#tp_n').value.trim(), c = $('#tp_c').value.trim();
  if (n !== c){ toast('Os PINs novos não são iguais'); return; }
  google.script.run
    .withSuccessHandler(r => {
      if (!r || !r.ok){ toast(r && r.erro ? r.erro : 'Não consegui trocar o PIN'); return; }
      TOKEN = r.token; try { localStorage.setItem('gc_token', TOKEN); } catch(e){}
      closeModal(); toast('PIN trocado');
    })
    .withFailureHandler(() => toast('Não consegui trocar o PIN agora'))
    .trocarPin(a, n, TOKEN);
}
function loadAll(){
  if (MULTI && !TOKEN) return showConta(USUARIO ? 'entrar' : 'criar');
  if (GAS){
    google.script.run
      .withSuccessHandler(raw => { hideLock(); S = hydrate(raw); renderAll(); })
      .withFailureHandler(err => isAuthErr(err) ? showLock(err) : loadError(err))
      .loadData(TOKEN);
  } else {
    let raw = null; try { raw = localStorage.getItem('gcp_data'); } catch(e){}
    S = hydrate(raw); renderAll();
  }
}

/* Se a planilha não responder, mostra o motivo e não salva nada por cima dos dados */
function loadError(err){
  const msg = err && err.message ? err.message : String(err || 'erro desconhecido');
  const auth = /autoriza|authoriz|permiss|permission|scope/i.test(msg);
  $('#logo').innerHTML = IC.spark;
  $('#hero').innerHTML = `
    <span class="kicker">${IC.spark} Não consegui abrir a planilha</span>
    <h2 style="margin-top:12px">${auth ? 'Falta autorizar o script' : 'A planilha não respondeu'}</h2>
    <p style="margin:10px 0 6px;line-height:1.5">${auth
      ? 'No editor do Apps Script, selecione a função <b>autorizar</b> e clique em Executar. Aceite as permissões e depois publique uma Nova versão em Gerenciar implantações.'
      : 'Seus dados estão seguros na planilha, nada foi alterado. Tente recarregar em alguns segundos.'}</p>
    <p class="hint" style="font-family:monospace">${esc(msg)}</p>
    <button class="btn bg-yellow" style="margin-top:14px" onclick="location.reload()">${ic('refresh')}Tentar de novo</button>`;
  $('#view').innerHTML = '';
  setSave('err', 'Sem conexão com a planilha');
}

/* ================== MERCADO ================== */
function setRates(m){
  const r = { BRL:1 };
  Object.keys(m.fx || {}).forEach(k => { if (m.fx[k] && +m.fx[k].bid) r[k] = +m.fx[k].bid; });
  if (m.usd && +m.usd.bid) r.USD = +m.usd.bid;
  if (!r.USD) r.USD = RATES.USD || 5.4;
  RATES = r; RATE = r.USD;
}
function applyMarket(m){
  if (!m) return;
  MARKET = m;
  setRates(m);
  try { localStorage.setItem('gcp_market', JSON.stringify(m)); } catch(e){}
  if (S) renderAll();
}
function loadMarket(force){
  try { const c = JSON.parse(localStorage.getItem('gcp_market')||'null'); if (c && c.usd){ MARKET = c; setRates(c); MARKET.live = false; } } catch(e){}
  if (GAS && !force){
    google.script.run.withSuccessHandler(applyMarket).withFailureHandler(clientMarket).getMarket();
  } else clientMarket();
}
async function clientMarket(){
  const m = { usd:null, cdi:null, hist:[], at:new Date().toISOString(), live:false };
  try {
    const r = (await (await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL')).json()).USDBRL;
    m.usd = { bid:+r.bid, ask:+r.ask, high:+r.high, low:+r.low, pct:+r.pctChange, date:r.create_date, src:'AwesomeAPI' };
  } catch(e){}
  try {
    const h = await (await fetch('https://economia.awesomeapi.com.br/json/daily/USD-BRL/30')).json();
    m.hist = h.map(x => ({ t:+x.timestamp, v:+x.bid })).reverse();
  } catch(e){}
  try {
    const d = await (await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json')).json();
    m.cdi = { aa: parseFloat(String(d[0].valor).replace(',','.')), date: d[0].data, src:'BCB CDI' };
  } catch(e){}
  m.fx = {};
  try {
    const pairs = CUR_KEYS.filter(k => k !== 'BRL').map(k => k + '-BRL').join(',');
    const d = await (await fetch('https://economia.awesomeapi.com.br/json/last/' + pairs)).json();
    Object.keys(d).forEach(k => { const x = d[k]; m.fx[x.code] = { bid:+x.bid, pct:+x.pctChange }; });
  } catch(e){}
  if (Object.keys(m.fx).length < CUR_KEYS.length - 2){
    try {
      const d = await (await fetch('https://open.er-api.com/v6/latest/BRL')).json();
      CUR_KEYS.forEach(k => { if (k !== 'BRL' && !m.fx[k] && d.rates && d.rates[k]) m.fx[k] = { bid: 1 / d.rates[k], pct: 0 }; });
    } catch(e){}
  }
  if (!Object.keys(m.fx).length && MARKET.fx) m.fx = MARKET.fx;
  m.live = !!m.usd;
  if (!m.usd && MARKET.usd) m.usd = MARKET.usd;
  if (!m.cdi && MARKET.cdi) m.cdi = MARKET.cdi;
  if (!m.hist.length && MARKET.hist) m.hist = MARKET.hist;
  applyMarket(m);
}

/* ================== RENDER GERAL ================== */
function renderAll(){
  if (!S) return;
  try { renderTop(); } catch(e){ showFatal(e, 'topo'); }
  let T;
  try { T = totals(); } catch(e){ showFatal(e, 'cálculo dos totais'); return; }
  try { let dirty = snapshot(T); if (checkAch(T)) dirty = true; if (dirty) persist(); } catch(e){ console.warn(e); }
  try { renderHero(T); } catch(e){ showFatal(e, 'barra de progresso'); }
  try { renderTabs(); } catch(e){ showFatal(e, 'abas'); }
  try { $('#view').innerHTML = S.settings.simples ? vSimple(T) : VIEWS[TAB](T); afterView(); } catch(e){ showFatal(e, 'tela ' + TAB); }
}

/* Mostra qualquer erro na tela em vez de deixar a página em branco */
function showFatal(err, onde){
  window.__fatalShown = true;
  const msg = (err && (err.stack || err.message)) || String(err);
  const box = document.getElementById('fatal') || (() => { const d = document.createElement('div'); d.id = 'fatal'; d.className = 'card pad bg-pink'; d.style.margin = '0 0 18px'; document.querySelector('.wrap').insertBefore(d, document.getElementById('hero')); return d; })();
  box.innerHTML = `<b>Algo deu errado${onde ? ' em ' + onde : ''}</b><p class="hint" style="margin:6px 0 8px">Tire um print desta caixa e me envie. Seus dados continuam seguros na planilha.</p>
    <pre style="white-space:pre-wrap;font-size:12px;border:2px solid var(--ink);border-radius:8px;padding:10px;max-height:220px;overflow:auto">${esc(String(msg).split('\n').slice(0,6).join('\n'))}</pre>
    <div class="hint">Versão ${VERSION}</div>`;
}
window.addEventListener('error', e => showFatal(e.error || e.message, 'script'));
window.addEventListener('unhandledrejection', e => showFatal(e.reason, 'carregamento'));

const MODES = {
  liquido:    { t:'Liquidez',              full:'Dinheiro Líquido',               c:'teal' },
  patrimonio: { t:'Patrimônio',            full:'Patrimônio Imobiliário Líquido', c:'purple' },
  total:      { t:'Total',                 full:'Patrimônio Total',               c:'coral' }
};
function modeValue(mode, T){
  const v = mode === 'liquido' ? T.liquidoBRL : mode === 'patrimonio' ? T.patrBRL : T.totalBRL;
  return fromBRL(v, S.settings.goalCurrency);
}
function tier(p){
  if (p >= 100) return 'META BATIDA! Hora de sonhar mais alto';
  if (p >= 90)  return 'Falta muito pouco. Segura firme!';
  if (p >= 75)  return 'Reta final, a meta já está à vista';
  if (p >= 50)  return 'Mais da metade conquistada! Agora é acelerar';
  if (p >= 25)  return 'Ganhando tração rumo à metade';
  if (p >= 10)  return 'Ritmo forte, cada aporte conta';
  if (p >= 3)   return 'A base está sendo construída, tijolo por tijolo';
  return 'Todo grande patrimônio começa assim. Primeiro passo dado!';
}
function renderHero(T){
  const simple = !!S.settings.simples;
  const mode = simple ? 'total' : S.settings.barMode, gc = S.settings.goalCurrency, M = MODES[mode];
  const v = modeValue(mode, T), g = +S.settings.goals[mode] || 1;
  const p = Math.max(0, v / g * 100), w = PRIV() ? 0 : Math.min(100, p);
  const falta = g - v;

  // marcos e confete
  let celebrate = false;
  Object.keys(MODES).forEach(k => {
    const pk = modeValue(k, T) / (+S.settings.goals[k]||1) * 100;
    const step = Math.min(100, Math.floor(pk/25)*25);
    const prev = S.settings.marcos[k];
    if (prev === undefined){ S.settings.marcos[k] = step; }
    else if (step > prev){ S.settings.marcos[k] = step; celebrate = { k, step }; }
  });

    if (!PRIV()) setTimeout(() => { confetti(); toast('Marco de ' + celebrate.step + '% alcançado em ' + MODES[celebrate.k].full + '!'); }, 500);
    persist();
  }

  const vc = S.settings.view;

  const others = Object.keys(MODES).filter(k => k !== mode);
  const mini = k => {
    const pp = Math.max(0, modeValue(k, T) / (+S.settings.goals[k]||1) * 100);
    return `<div class="mini" onclick="setMode('${k}')">

    + `<div class="mk mk-end ${p>=100&&!PRIV()?'hit':''}">${compact(gV, vc)}</div>`;

  $('#hero').innerHTML = `
    <div class="hero-l">
      <span class="eyebrow"><i></i>Rumo ao primeiro milhão</span>
      <div class="hero-title">${M.full}</div>

        ${Object.keys(MODES).map(k => `<button class="btn ${k===mode?'on':''}" onclick="setMode('${k}')">${MODES[k].t}</button>`).join('')}

    </div>
    <div class="hero-r">
      <div class="phone">
        <div class="ph-top">
          <span class="ph-ic">${IC.spark}</span>

        <div class="ph-body">

          <div class="ph-val num">${compact(gV, vc)}</div>
          <div class="bar click-bar" onclick="openBreakdown('${mode}')" title="Ver composição">
            <div class="fill ${w>=99.5?'full':''}" data-w="${w}" style="width:${heroAnimated ? w : 0}%"></div>
            <div class="runner" data-w="${w}" style="left:${heroAnimated ? Math.max(2,Math.min(98,w)) : 2}%">${IC.spark}</div>
          </div>

/* Composição da barra: de onde vem cada valor */
function openBreakdown(mode){
  const gc = S.settings.goalCurrency, T = totals();
  const g = +S.settings.goals[mode] || 1;
  const row = (label, sub, v, cls='') => `<div class="bd-row ${cls}">
      <div class="bd-l"><b>${esc(label)}</b>${sub ? `<small>${sub}</small>` : ''}</div>
      <div class="bd-v num ${v < 0 ? 'neg' : ''}">${money(v, gc)}</div></div>`;

  const contasBlock = () => {
    let sub = 0;
    const rows = S.contas.map(c => {
      const s = contaSaldo(c), vBRL = conv(s, c.moeda, 'BRL'), v = fromBRL(vBRL, gc); sub += v;
      const det = c.moeda !== gc
        ? money(s, c.moeda) + ' × ' + money(conv(1, c.moeda, gc), gc)
        : c.dataConfirmado ? 'confirmado em ' + fmtDate(c.dataConfirmado) + (depoisConfirmado(c) ? ', mais ' + depoisConfirmado(c) + (depoisConfirmado(c) > 1 ? ' lançamentos' : ' lançamento') + ' depois' : '')
        : (S.lancamentos.some(l => l.contaId === c.id) ? 'saldo inicial somado aos lançamentos' : 'saldo da conta');
      return row(c.nome, det, v);
    }).join('');
    return `<div class="bd-group"><div class="bd-h bg-teal">${ic('wallet')} Dinheiro em conta</div>${rows || '<div class="empty">Nenhuma conta</div>'}
      <div class="bd-row bd-sub"><div class="bd-l"><b>Subtotal liquidez</b></div><div class="bd-v num">${money(sub, gc)}</div></div></div>`;
  };
  const imoveisBlock = () => {
    let sub = 0;
    const rows = S.imoveis.map(im => {
      const k = calcImovel(im), m = im.moeda || 'BRL', v = fromBRL(conv(k.liquido, m, 'BRL'), gc); sub += v;
      let det;
      if (im.metodo === 'mercado')
        det = k.saldoDev > 0 ? 'valor ' + money(im.valorTotal, m) + ' menos saldo devedor ' + money(k.saldoDev, m) : 'valor do imóvel, sem saldo devedor';
      else
        det = 'tudo que já foi pago' + (k.pays.length ? ', incluindo ' + k.pays.length + ' parcela' + (k.pays.length > 1 ? 's' : '') + ' do calendário' : '');
      return row(im.nome, det, v);
    }).join('');
    return `<div class="bd-group"><div class="bd-h bg-purple">${ic('home')} Imóveis</div>${rows || '<div class="empty">Nenhum imóvel</div>'}
      <div class="bd-row bd-sub"><div class="bd-l"><b>Subtotal imóveis</b></div><div class="bd-v num">${money(sub, gc)}</div></div></div>`;
  };

  const v = modeValue(mode, T), p = v / g * 100, falta = g - v;
  const body = mode === 'liquido' ? contasBlock() : mode === 'patrimonio' ? imoveisBlock() : contasBlock() + imoveisBlock();
  const nota = S.contas.some(c => c.moeda !== gc) || S.imoveis.some(i => (i.moeda||'BRL') !== gc)
    ? `<div class="hint">Valores em outras moedas convertidos pela cotação de agora.</div>` : '';

  openModal(`
    <div class="mhead bg-${MODES[mode].c}"><div><small style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px">De onde vem esse valor</small><h3>${MODES[mode].full}</h3></div>
      <button class="btn icon bg-paper" onclick="closeModal()">${ic('close')}</button></div>
    <div class="mbody">
      ${body}
      <div class="bd-total">
        <div class="bd-row"><div class="bd-l"><b>Total</b></div><div class="bd-v num">${money(v, gc)}</div></div>
        <div class="bd-row"><div class="bd-l">Meta</div><div class="bd-v num">${money(g, gc)}</div></div>
        <div class="bd-row"><div class="bd-l">${falta > 0 ? 'Faltam' : 'Superou em'}</div><div class="bd-v num">${money(Math.abs(falta), gc)}</div></div>
        ${T.rendBRL > 0 && mode !== 'patrimonio' ? `<div class="bd-row"><div class="bd-l">Rendendo pelo CDI</div><div class="bd-v num">${money(fromBRL(T.rendBRL, gc), gc)} por mês</div></div>` : ''}
        <div class="pbar" style="height:10px;margin-top:10px"><i class="bg-${MODES[mode].c}" style="width:${Math.min(100, Math.max(0,p))}%"></i></div>
        <div style="text-align:right;font-weight:700;margin-top:6px" class="mono">${pctFmt(p)} da meta</div>
      </div>
      ${nota}
    </div>
    <div class="mfoot">
      ${Object.keys(MODES).filter(k => k !== mode).map(k => `<button class="btn sm" onclick="openBreakdown('${k}')">Ver ${MODES[k].full}</button>`).join('')}
    </div>`);
}

/* Encolhe o valor principal até caber numa linha só */
function fitHero(){
  const big = $('#heroBig'); if (!big) return;
  const box = big.parentElement, txt = big.textContent;
  big.textContent = compact(+big.dataset.to, big.dataset.cur);
  big.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(big).fontSize), n = 0;
  while (big.scrollWidth > box.clientWidth && fs > 28 && n++ < 60){ fs -= 2; big.style.fontSize = fs + 'px'; }
  big.textContent = txt;
}
window.addEventListener('resize', () => { clearTimeout(window.__fh); window.__fh = setTimeout(fitHero, 120); });
function animateHero(){
  fitHero();
  const fill = $('#hero .fill'), run = $('#hero .runner'), big = $('#heroBig');
  if (!fill || heroAnimated) return;
  heroAnimated = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const w = +fill.dataset.w;
    fill.style.width = w + '%';
    run.style.left = Math.max(2, Math.min(98, w)) + '%';
  }));
  const to = +big.dataset.to, cur = big.dataset.cur, t0 = performance.now(), dur = 1500;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    big.textContent = compact(to * e, cur);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- CALENDÁRIO ---------- */
function vCal(){
  const y = cal.y, m = cal.m;
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  const key = y + '-' + pad(m+1);
  const monthL = S.lancamentos.filter(l => l.data.startsWith(key));
  const byDay = {};
  monthL.forEach(l => { (byDay[l.data] = byDay[l.data] || []).push(l); });
  const dueDay = {};
  S.receber.forEach(r => { if (r.dataPrevista && r.dataPrevista.startsWith(key) && !calcRec(r).done) (dueDay[r.dataPrevista] = dueDay[r.dataPrevista] || []).push(r); });
  const today = todayISO();

  let cells = '';
  for (let i=0;i<first;i++) cells += '<div class="day blank"></div>';
  for (let d=1; d<=days; d++){
    const iso = key + '-' + pad(d), ls = byDay[iso] || [];
    const net = ls.reduce((a,l) => a + lancBRL(l), 0);
    const hasIm = ls.some(l => l.imovelId), hasRc = ls.some(l => l.receberId), due = dueDay[iso];
    cells += `<button class="day ${iso===today?'today':''} ${iso===cal.sel?'sel':''}" onclick="selDay('${iso}')">
      <span class="dn">${d}</span>
      ${ls.length ? `<span class="dv num ${net>=0?'pos':'neg'}">${net>=0?'+':''}${compact(net,'BRL').replace('R$ ','')}</span>` : ''}
      <span class="dots">${hasIm?'<i class="bg-purple"></i>':''}${hasRc?'<i class="bg-teal"></i>':''}${due?'<i class="bg-orange"></i>':''}</span>
    </button>`;
  }

  let ent=0, sai=0, pim=0;
  monthL.forEach(l => { const v = lancBRL(l); if (v >= 0) ent += v; else sai += v; if (l.imovelId) pim += Math.abs(v); });

  const selL = (byDay[cal.sel] || []).concat(S.lancamentos.filter(l => l.data === cal.sel && !l.data.startsWith(key)));
  const selDue = S.receber.filter(r => r.dataPrevista === cal.sel && !calcRec(r).done);

  return `
  <div class="cal-wrap">
    <div class="card pad">
      <div class="cal-head">
        <button class="btn icon" onclick="calMove(-1)">${ic('left')}</button>
        <h2>${MONTHS[m]} ${y}</h2>
        <button class="btn icon" onclick="calMove(1)">${ic('right')}</button>
      </div>
      <div class="wk">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="days">${cells}</div>
      <div class="legend" style="margin-top:14px">
        <span><i class="bg-purple" style="border-radius:50%"></i>Pagamento de imóvel</span>
        <span><i class="bg-teal" style="border-radius:50%"></i>Recebido</span>
        <span><i class="bg-orange" style="border-radius:50%"></i>Previsão de recebimento</span>
      </div>
      <div class="msum">
        <div><small class="dot-l teal">Entradas</small><b class="num">${money(ent)}</b></div>
        <div><small class="dot-l coral">Saídas</small><b class="num">${money(sai)}</b></div>
        <div><small class="dot-l purple">Em imóveis</small><b class="num">${money(pim)}</b></div>
        <div class="bg-yellow"><small>Saldo do mês</small><b class="num">${money(ent+sai)}</b></div>
      </div>
    </div>

    <div class="card">
      <div class="mhead bg-yellow"><div><small style="font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px">Dia selecionado</small><h3>${fmtDate(cal.sel)}</h3></div>
        <button class="btn bg-paper" onclick="openLanc({data:'${cal.sel}'})">${ic('plus')}Lançar</button></div>
      <div class="mbody">
        ${selDue.map(r => `<div class="li"><div class="dt bg-orange"><b>!</b>prev.</div><div class="main"><div class="t">Previsto receber de ${esc(r.pessoa)}</div><div class="m">${esc(r.descricao||'')}</div></div>
          <button class="btn sm bg-teal" onclick="openLanc({data:'${cal.sel}',receberId:'${r.id}'})">Receber</button></div>`).join('')}
        ${selL.length ? `<div class="list">${selL.map(l => lancItem(l, true)).join('')}</div>`
          : (selDue.length ? '' : '<div class="empty">Sem lançamentos neste dia.<br>Toque em Lançar para adicionar um recebimento, despesa ou parcela.</div>')}
      </div>
    </div>
  </div>

  <h3 class="sec">Lançamentos de ${MONTHS[m]}</h3>
  <div class="card pad">
    ${monthL.length ? `<div class="list">${monthL.slice().sort((a,b)=>a.data<b.data?1:-1).map(l => lancItem(l, true)).join('')}</div>` : '<div class="empty">Nenhum lançamento neste mês.</div>'}
  </div>`;
}
function selDay(iso){ cal.sel = iso; renderAll(); }
function calMove(d){
  cal.m += d;
  if (cal.m < 0){ cal.m = 11; cal.y--; } if (cal.m > 11){ cal.m = 0; cal.y++; }
  cal.sel = cal.y + '-' + pad(cal.m+1) + '-01';
  renderAll();
}

/* ---------- LANÇAMENTO (modal) ---------- */
function openLanc(o){
  const ex = o.id ? S.lancamentos.find(l => l.id === o.id) : null;
  const l = ex ? clone(ex) : { data: o.data || cal.sel || todayISO(), valor:'', contaId: (S.contas.find(c => c.moeda==='BRL')||S.contas[0]||{}).id,
    imovelId: o.imovelId || '', receberId: o.receberId || '', desc:'' };
  const op = l.imovelId ? 'im:' + l.imovelId : l.receberId ? 'rc:' + l.receberId : 'livre';
  const pend = S.receber.filter(r => !calcRec(r).done || r.id === l.receberId);
  openModal(`
    <div class="mhead bg-yellow"><div><h3>${ex ? 'Editar lançamento' : 'Novo lançamento'}</h3></div><button class="btn icon bg-paper" onclick="closeModal()">${ic('close')}</button></div>
    <div class="mbody">
      <div class="field"><label>Operação</label>
        <select id="lOp" onchange="lancHint()">
          <option value="livre" ${op==='livre'?'selected':''}>Entrada ou saída livre</option>
          <optgroup label="Pagamento de imóvel">
            ${S.imoveis.map(i => `<option value="im:${i.id}" ${op==='im:'+i.id?'selected':''}>Pagamento ${esc(i.nome)}</option>`).join('')}
          </optgroup>
          ${pend.length ? `<optgroup label="Recebimento de valor a receber">
            ${pend.map(r => `<option value="rc:${r.id}" ${op==='rc:'+r.id?'selected':''}>Recebido de ${esc(r.pessoa)}${r.descricao ? ' · ' + esc(r.descricao) : ''}</option>`).join('')}
          </optgroup>` : ''}
        </select>
        <div class="hint" id="lHint"></div>
      </div>
      <div class="g2">
        <div class="field"><label>Valor</label><input id="lVal" inputmode="decimal" placeholder="ex. −1500 ou 3000" value="${ex ? fmtIn(ex.valor) : ''}"></div>
        <div class="field"><label>Data</label><input id="lData" type="date" value="${l.data}" onchange="lancHint()"></div>
      </div>
      <div class="field"><label>Conta</label>
        <select id="lConta" onchange="lancHint()">${S.contas.map(c => `<option value="${c.id}" ${c.id===l.contaId?'selected':''}>${esc(c.nome)} (${c.moeda})</option>`).join('')}</select>
      </div>
      <div class="field"><label>Descrição</label><input id="lDesc" placeholder="opcional" value="${esc(l.desc)}"></div>
    </div>
    <div class="mfoot">
      ${ex ? `<button class="btn bg-pink" onclick="delLanc('${ex.id}')">${ic('trash')}Excluir</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn bg-teal" onclick="saveLanc('${ex ? ex.id : ''}')">${ic('plus')}Salvar</button>
    </div>`);
  lancHint();
  setTimeout(() => $('#lVal').focus(), 60);
}
function lancHint(){
  const v = $('#lOp').value, h = $('#lHint');
  if (v.startsWith('im:')){
    const im = S.imoveis.find(i => i.id === v.slice(3));
    h.innerHTML = 'Sai da conta escolhida e entra como <b>parcela paga</b> em ' + esc(im.nome) + (im.metodo === 'mercado' ? ', abatendo o saldo devedor.' : ', aumentando o valor investido e o retorno projetado.');
  } else if (v.startsWith('rc:')) h.innerHTML = 'Entra na conta escolhida e abate do valor pendente a receber.';
  else h.innerHTML = 'Use valor positivo para entrada e negativo para saída.';
  const c = contaById($('#lConta').value), d = $('#lData').value;
  if (c && c.dataConfirmado && d && d <= c.dataConfirmado)
    h.innerHTML += '<br><span class="tag" style="background:var(--yellow)">Histórico</span> Data até o saldo confirmado em ' + fmtDate(c.dataConfirmado) + ', então não desconta da conta de novo.';
}
function saveLanc(id){
  const op = $('#lOp').value;
  let v = parseNum($('#lVal').value);
  if (!v){ toast('Informe um valor'); return; }
  const imovelId = op.startsWith('im:') ? op.slice(3) : '';
  const receberId = op.startsWith('rc:') ? op.slice(3) : '';
  if (imovelId) v = -Math.abs(v);
  if (receberId) v = Math.abs(v);
  let desc = $('#lDesc').value.trim();
  if (!desc && imovelId) desc = 'Pagamento ' + S.imoveis.find(i => i.id === imovelId).nome;
  if (!desc && receberId) desc = 'Recebido de ' + S.receber.find(r => r.id === receberId).pessoa;
  const old = id ? S.lancamentos.find(l => l.id === id) : null;
  const obj = { id: id || uid('l'), data: $('#lData').value || todayISO(), valor: v, contaId: $('#lConta').value,
                imovelId, receberId, desc, cotacao: old && old.cotacao ? old.cotacao : RATE, taxas: old && old.taxas ? old.taxas : Object.assign({}, RATES) };
  if (old) Object.assign(old, obj); else S.lancamentos.push(obj);
  cal.sel = obj.data; cal.y = +obj.data.slice(0,4); cal.m = +obj.data.slice(5,7) - 1;
  closeModal(); commit();
  toast(imovelId ? 'Parcela registrada no imóvel' : receberId ? 'Recebimento registrado' : 'Lançamento salvo');
}
function delLanc(id){
  if (!confirm('Excluir este lançamento?')) return;
  S.lancamentos = S.lancamentos.filter(l => l.id !== id);
  closeModal(); commit();
}

/* Retorno: por porcentagem ou pelo valor estimado de venda */

        <button class="${modo==='valor'?'on':''}" onclick="retModo('${im.id}','valor')">Valor de venda</button>

    </div>

      <div class="row between" style="margin-top:12px"><span class="muted" style="font-weight:600;font-size:13px">Arraste para ajustar</span><span class="chip mono" id="retLbl">${pctFmt(k.retPct,0)}</span></div>

function retPreview(id, v){

function retPreviewValor(id, txt){

/* ---------- WALLET ---------- */
function sparkSVG(h){
  if (!h || h.length < 2) return '<svg class="spark"></svg>';
  const W = 600, H = 90, P = 8, vs = h.map(x => x.v), mn = Math.min(...vs), mx = Math.max(...vs), rg = (mx - mn) || 1;
  const pts = h.map((x,i) => [P + i*(W-2*P)/(h.length-1), H - P - (x.v-mn)/rg*(H-2*P)]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d} L ${last[0]} ${H} L ${P} ${H} Z" fill="#000" opacity=".08"/>
    <path d="${d}" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="#000" stroke="#FEC504" stroke-width="3"/></svg>`;
}

      </div>
      <div class="row wrapr" style="margin-top:10px;gap:8px;font-weight:600;font-size:13px">
        ${u && u.high ? `<span class="chip">Máx ${money(u.high,'BRL')}</span><span class="chip">Mín ${money(u.low,'BRL')}</span>` : ''}
        ${var30 !== null ? `<span class="chip">30 dias ${var30>=0?'+':'−'}${pctFmt(Math.abs(var30),2,true)}</span>` : ''}
        <span class="chip">${MARKET.live ? 'Ao vivo' : 'Última cotação salva'}${u && u.date ? ' · ' + esc(String(u.date).slice(0,16)) : ''}</span>
      </div>
      ${sparkSVG(h)}
      <div class="conv">
        <div><label><select id="cvCur" class="cv-sel" onchange="cvFrom('U')">${CUR_KEYS.filter(k => k !== 'BRL').map(k => `<option value="${k}" ${k==='USD'?'selected':''}>${k}</option>`).join('')}</select></label><input id="cvU" inputmode="decimal" placeholder="valor" oninput="cvFrom('U')"></div>
        <div class="eq">⇄</div>

/* ================== HISTÓRIA, CONQUISTAS E PREVISÃO ================== */
function monthKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function monthName(key){ const [y,m] = key.split('-'); return MONTHS[+m-1] + ' de ' + y; }
function addMonths(n){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); return monthKey(d); }
function monthsBetween(a, b){ return (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7)); }
function goalTotalBRL(){ return conv(+S.settings.goals.total || 1e6, S.settings.goalCurrency, 'BRL'); }

function snapshot(T){
  S.snaps = S.snaps || {};
  const k = monthKey(), cur = S.snaps[k];
  const val = { t: Math.round(T.totalBRL), l: Math.round(T.liquidoBRL), p: Math.round(T.patrBRL) };
  if (!cur || Math.abs(cur.t - val.t) >= 1){ S.snaps[k] = val; return true; }
  return false;
}
function cashFlowByMonth(){
  const m = {};
  S.lancamentos.forEach(l => { if (l.imovelId) return; const k = l.data.slice(0,7); m[k] = (m[k]||0) + lancBRL(l); });
  return m;
}
function growthMonth(T){
  const k = monthKey(), keys = Object.keys(S.snaps||{}).filter(x => x < k).sort();
  if (keys.length) return T.totalBRL - S.snaps[keys[keys.length-1]].t;
  return cashFlowByMonth()[k] || 0;
}
function avgGrowth(T){
  const keys = Object.keys(S.snaps||{}).sort();
  if (keys.length >= 2){
    const a = keys[0], b = keys[keys.length-1], n = monthsBetween(a, b);
    if (n >= 1) return (S.snaps[b].t - S.snaps[a].t) / n;
  }
  const cf = cashFlowByMonth(), ks = Object.keys(cf).sort();
  if (!ks.length) return T.rendBRL > 0 ? T.rendBRL : null;
  const span = Math.max(1, monthsBetween(ks[0], monthKey()) + 1);
  return ks.reduce((a,k) => a + cf[k], 0) / span + T.rendBRL;
}
function forecast(T){
  const falta = goalTotalBRL() - T.totalBRL;
  if (falta <= 0) return { done:true, txt:'Meta do primeiro milhão batida!' };
  const avg = avgGrowth(T);
  if (!avg || avg <= 0) return { none:true, txt:'Registre os aportes no calendário para descobrir quando o milhão chega' };
  const n = Math.ceil(falta / avg);
  if (n > 600) return { none:true, txt:'O milhão ainda está longe no ritmo atual, cada aporte aproxima essa data' };
  const k = addMonths(n);
  return { n, key:k, label: monthName(k), avg, txt:'No ritmo atual, o primeiro milhão chega em ' + monthName(k) };
}
function storyHTML(T){
  const vc = S.settings.view, p = T.totalBRL / goalTotalBRL() * 100, g = growthMonth(T), f = forecast(T);
  if (PRIV()) return 'Valores escondidos. Toque no olho no topo para mostrar.';
  if (f.done) return 'Vocês conquistaram o primeiro milhão! \u{1F389}';
  let s = `Vocês já conquistaram <b>${pctFmt(p,0)}</b> do primeiro milhão`;
  if (g > 0) s += ` e cresceram <b>${compact(fromBRL(g, vc), vc)}</b> este mês`;
  s += '.';
  if (f.key) s += ` No ritmo atual, ele chega em <b>${f.label}</b>.`;
  return s;
}

function streak(){
  const set = new Set(S.lancamentos.filter(l => l.imovelId || +l.valor > 0).map(l => l.data.slice(0,7)));
  let n = 0; const d = new Date(); d.setDate(1);
  if (!set.has(monthKey(d))) d.setMonth(d.getMonth()-1);
  while (set.has(monthKey(d))){ n++; d.setMonth(d.getMonth()-1); }
  return n;
}

/* Dados extras usados pelas conquistas de crescimento, classes, países e tempo */
const PAIS = { BRL:'BR', USD:'US', EUR:'EU', GBP:'GB', CAD:'CA', AUD:'AU', CHF:'CH', JPY:'JP', CNY:'CN', ARS:'AR', MXN:'MX', CLP:'CL' };
const ACH_GRUPOS = [
  ['Patrimônio em reais',  ['t100','t250','t500','t750','t1m']],
  ['Patrimônio em dólar',  ['u1k','u5k','u10k','u25k','u50k','u100k','u250k','u500k']],
  ['Crescimento',          ['g0','g10','g25','g50','g100','volta']],
  ['Reserva e liquidez',   ['liq50','liq100','usd10']],
  ['Renda passiva',        ['cdi1k','smin','smin2']],
  ['Imóveis',              ['p10','half','quit']],
  ['Diversificação',       ['c2','c3','c5','m2','p2','p3']],
  ['Constância',           ['start','s3','s6','s12','ano1']],
  ['Especiais',            ['rec','lenda']]
];
function achCtx(T){
  const ser = evoSeries(T), base = ser.length ? ser[0].tot : 0;
  const cresc = base > 0 ? T.totalBRL / base - 1 : 0;
  let pico = 0, caiu = false, volta = false;
  ser.forEach(d => { if (caiu && d.tot >= pico) volta = true; if (d.tot > pico){ pico = d.tot; caiu = false; } else if (pico > 0 && d.tot <= pico * .8) caiu = true; });
  const cls = new Set(), paises = new Set(), moedas = new Set();
  S.contas.forEach(c => {
    if (contaSaldo(c) <= 0) return;
    moedas.add(c.moeda);
    if (PAIS[c.moeda]) paises.add(PAIS[c.moeda]);
    cls.add(c.moeda === 'BTC' ? 'cripto' : +c.cdi > 0 ? 'rendafixa' : c.moeda !== 'BRL' ? 'exterior' : 'caixa');
  });
  S.imoveis.forEach(im => {
    if (calcImovel(im).liquido <= 0) return;
    const m = im.moeda || 'BRL'; moedas.add(m); if (PAIS[m]) paises.add(PAIS[m]);
    cls.add(im.tipo === 'Terreno' ? 'terreno' : im.tipo === 'Sala comercial' ? 'comercial' : 'imovel');
  });
  if (S.receber.some(r => !calcRec(r).done)) cls.add('receber');
  const datas = S.lancamentos.map(l => l.data).concat((S.saldos || []).map(x => x.data), S.imoveis.map(i => i.dataCompra).filter(Boolean)).sort();
  const dias = datas.length ? (new Date(todayISO()) - new Date(datas[0])) / 864e5 : 0;
  return { cresc, volta, classes: cls.size, paises: paises.size, moedas: moedas.size, dias };
}
function checkAch(T){
  S.settings.conquistas = S.settings.conquistas || {};
  const C = S.settings.conquistas, st = streak(), novas = [], X = achCtx(T);
  ACH.forEach(a => { if (!C[a.id] && a.ok(T, st, X)){ C[a.id] = todayISO(); novas.push(a); } });
  const outras = ACH.filter(a => a.id !== 'lenda');
  if (!C.lenda && outras.filter(a => C[a.id]).length >= outras.length * .8){ C.lenda = todayISO(); novas.push(ACH.find(a => a.id === 'lenda')); }
  if (novas.length) setTimeout(() => { confetti(120); toast('\u{1F3C6} Conquista desbloqueada, ' + novas.map(a => a.t).join(', ')); }, 700);
  return novas.length > 0;
}
const ACH_VAL = new Set(ACH_GRUPOS.slice(0,6).flatMap(g => g[1]));
const achHide = a => PRIV() && ACH_VAL.has(a.id);
function achCard(a){
